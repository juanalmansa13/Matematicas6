    title.textContent = 'Practica el examen';
    sub.textContent = 'Sesión ' + n + ' · ' + s.name;
    const partesHtml = s.partes.map(p => `<div class="ex-row"><div class="ex-num">${p.titulo} <span style="font-weight:400;color:var(--ink-soft);">(${p.puntos} pts)</span></div><div class="ex-enun">${p.contenido.replace(/\n/g,'<br>')}</div></div>`).join('');
    const autoevalHtml = `<table class="rubrica-table"><tr><th>Sé que...</th><th>Repaso en</th></tr>${s.autoevaluacion.map(a => `<tr><td>${a.texto}</td><td>${a.repaso}</td></tr>`).join('')}</table>`;
    body.innerHTML = `<div class="teoria-box"><p>${s.intro}</p></div>${partesHtml}
      <div class="producto-box"><b>Autoevaluación</b></div>${autoevalHtml}
      <div class="producto-box"><b>Solucionario (corrige tú mismo)</b><p>${s.solucionario.replace(/\n/g,'<br>')}</p></div>`;
  }

  else if (type === 'saberes') {
    body.className = 'modal-body';
    title.textContent = 'Saberes trabajados';
    sub.textContent = 'Sesión ' + n + ' · ' + s.name;
    body.innerHTML = `<div class="saberes-box" style="margin-top:0;">
      ${s.saberes.map((txt, idx) => {
        const i = idx + 1;
        const checked = getSaberState(n, i);
        return `<label class="saber-item"><input type="checkbox" ${checked?'checked':''} onchange="updateSaber(${n},${i},this.checked)"> ${txt}</label>`;
      }).join('')}
    </div>`;
  }

  else if (type === 'pra') {
    body.className = 'modal-body';
    title.textContent = 'PRA · Refuerzo y apoyo';
    sub.textContent = 'Sesión ' + n + ' · ' + s.name + ' (contenido adaptado)';
    if (s.pra) {
      let html = `<div class="producto-box"><b>Explicación sencilla</b><p>${s.pra.teoria.replace(/\n/g,'<br>')}</p></div>`;
      html += s.pra.ejercicios.map((item, idx) => {
        const i = idx + 1;
        const itemsHtml = (item.items || []).map((it, j) => `<div class="ex-sub">${String.fromCharCode(97+j)}) ${it}</div>`).join('');
        return `<div class="ex-row">
          <div class="ex-num">Ejercicio ${i}</div>
          <div class="ex-enun">${item.enunciado}</div>
          <div class="ex-items">${itemsHtml}</div>
          <div class="ex-sol"><b>Solución:</b> ${item.solucion}</div>
        </div>`;
      }).join('');
      body.innerHTML = html;
    } else {
      body.innerHTML = `<div style="padding:16px;color:var(--ink-soft);font-size:13px;">Todavía no hay contenido PRA para esta sesión.</div>`;
    }
  }

  else if (type === 'criterios') {
    body.className = 'modal-body';
    title.textContent = 'Criterios de evaluación';
    sub.textContent = UNIT1.title + ' · máximo 3 por unidad';
    const critState = unitState().criteria || {};
    body.innerHTML = (UNIT1.criteria && UNIT1.criteria.length)
      ? `<div class="criteria-box" style="margin:0;">` + UNIT1.criteria.map(c => {
          const val = critState[c.code] || '';
          return `<div class="crit-item">
            <div class="crit-code">${c.code}</div>
            <div class="crit-label">${c.label}</div>
            <div class="crit-evidence-wrap">
              <span>Examen:</span>
              <input type="text" class="crit-evidence-input" placeholder="¿Qué apartado lo evalúa?" value="${val.replace(/"/g,'&quot;')}" onchange="updateCritExam('${c.code}', this.value)">
            </div>
          </div>`;
        }).join('') + `</div>`
      : `<div style="padding:16px;color:var(--ink-soft);font-size:13px;">Pendiente: cuando tengas la programación oficial, pásame los saberes y criterios de evaluación de esta unidad y los añado aquí.</div>`;
  }

  else if (type === 'video' || type === 'libro' || type === 'solucionario') {
    const st = unitState();
    const linkKey = type === 'solucionario' ? 'libro' : type;
    const fixedLink = type === 'video' ? FIXED_UNIT_VIDEOS[CURRENT_UNIT_ID] : (FIXED_UNIT_BOOKS[CURRENT_UNIT_ID] || FIXED_STUDENT_BOOK_URL);
    const baseUrl = (st[linkKey] || '').trim() || fixedLink || '';
    const resourceUrl = type === 'solucionario' ? (baseUrl ? baseUrl + '#page=' + SOLUTION_PAGES[CURRENT_UNIT_ID] : '') : baseUrl;
    const resourceTitle = type === 'video' ? 'Vídeo resumen de la unidad' : (type === 'solucionario' ? 'Solucionario de la unidad' : 'Libro del alumnado (PDF)');
    const resourceSub = type === 'video' ? 'Vídeo integrado para esta unidad' : (type === 'solucionario' ? 'Respuestas completas · PDF integrado' : 'PDF integrado · desplázate con la rueda del ratón');
    title.textContent = resourceTitle;
    sub.textContent = resourceSub;
    if (EDITING_LINK_KEY === linkKey) {
      body.className = 'modal-body';
      body.innerHTML = '<div class="link-row"><input type="text" id="linkEditInput" placeholder="https://..."><button type="button" class="open-link" onclick="guardarEnlaceRecurso(\'' + linkKey + '\')">Guardar</button></div><div class="save-hint">Pega aquí la URL correcta (Drive, PDF u otro enlace público). Se guarda automáticamente en este archivo.</div>';
      const inp = document.getElementById('linkEditInput');
      inp.value = baseUrl;
      inp.focus();
    } else if (resourceUrl) {
      body.className = 'modal-body drive-viewer-body';
      body.innerHTML = buildDriveViewer(resourceUrl, type === 'solucionario' ? 'libro' : type) +
        '<button type="button" class="edit-link-btn" onclick="EDITING_LINK_KEY=\'' + linkKey + '\'; openModal(\'' + type + '\')">✏️ Editar enlace</button>';
    } else {
      body.className = 'modal-body';
      body.innerHTML = '<div class="drive-empty">Todavía no hay un recurso enlazado para esta unidad.</div><button type="button" class="edit-link-btn" onclick="EDITING_LINK_KEY=\'' + linkKey + '\'; openModal(\'' + type + '\')">✏️ Añadir enlace</button>';
    }
  }
  else if (type === 'examen') {
    body.className = 'modal-body';
    title.textContent = 'Examen (Drive)';
    sub.textContent = 'Enlace a la prueba de evaluación de la unidad';
    body.innerHTML = '<div class="link-row"><input type="text" id="examenInput" placeholder="https://drive.google.com/..."><a href="#" id="examenOpen" class="open-link disabled" target="_blank" rel="noopener">Abrir</a></div><div class="save-hint">Se guarda automáticamente en este archivo</div>';
    const st = unitState();
    const inp = document.getElementById('examenInput');
    inp.value = st.examen || '';
    refreshLink('examen');
    inp.addEventListener('input', function() { unitState().examen = this.value; saveState(); refreshLink('examen'); });
  }
  else if (type === 'observaciones') {
    body.className = 'modal-body';
    title.textContent = 'Observaciones del profesorado';
    sub.textContent = 'Erratas, sugerencias o notas sobre esta unidad';
    body.innerHTML = `<textarea class="obs-textarea" id="obsUnidadInput" placeholder="Escribe aquí..."></textarea>
      <div class="save-hint">Se guarda automáticamente en este archivo</div>`;
    const ta = document.getElementById('obsUnidadInput');
    ta.value = unitState().obsUnidad || '';
    ta.addEventListener('input', function() { unitState().obsUnidad = this.value; saveState(); });
  }

  else if (type === 'calendario') {
    body.className = 'modal-body';
    title.textContent = 'Calendario de la unidad';
    sub.textContent = UNIT1.title + ' · ' + UNIT1.sessions.length + ' sesiones';
    body.innerHTML = buildCalendarModalHtml();
  }

  overlay.classList.add('open');
}

function closeModal() { document.getElementById('overlay').classList.remove('open'); CURRENT_MODAL_TYPE = null; }

function descargarSesion(n) {
  const s = UNIT1.sessions.find(x => x.n === n);
  const st = getSessionState(n);
  const fecha = fmtFechaCorta(st.fecha || s.fecha);

  if (s.tipo_examen) {
    const partesHtml = s.partes.map(p => `<h3 style="font-size:12pt;color:#223A5E;">${p.titulo} (${p.puntos} pts)</h3><p>${p.contenido.replace(/\n/g,'<br>')}</p>`).join('');
    const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->
<style>@page { margin: 0.6in; } body { margin: 0; }</style></head>
<body style="font-family:Calibri,Arial,sans-serif;font-size:11pt;">
<div style="font-size:15pt;font-weight:bold;color:#223A5E;">${UNIT1.title} · Sesión ${s.n}</div>
<div style="font-size:12pt;">${s.name}</div>
<div style="font-size:10pt;color:#5B5450;">${fecha} · Matemáticas, 6.º Primaria</div>
<hr style="border:none;border-top:1pt solid #000;margin-bottom:10pt;">
${partesHtml}
</body></html>`;
    const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${UNIT1.title.replace(/\s+/g,'')}_Sesion${n}_${(st.fecha || s.fecha)}.doc`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    return;
  }

  const calculoHtml = `<h3 style="font-size:12pt;color:#223A5E;">Cálculo diario</h3>` +
    Object.entries({sumas:'Sumas',restas:'Restas',mult:'Multiplicaciones',div:'Divisiones'}).map(([k,label]) =>
      `<p><b>${label}:</b> ` + s.calculo_diario[k].map(p => p[0]).join(' · ') + `</p>`).join('');

  const ejerciciosHtml = s.ejercicios.map((item, idx) =>
    `<p style="margin:6pt 0;"><b>${idx + 1}.</b> ${item.enunciado} ${item.items.map((it,j)=>String.fromCharCode(97+j)+') '+it).join(' · ')}</p>`
  ).join('');

  const infografiaHtml = s.infografia_b64
    ? `<h3 style="font-size:12pt;color:#223A5E;">Infografía</h3><p><img src="${s.infografia_b64}" Width="200"></p>`
    : '';

  const problemaHtml = s.problema_casa
    ? `<p style="margin-top:12pt;padding:8pt 10pt;background:#E8EDF3;border-left:3pt solid #223A5E;"><b>Un problema para casa:</b> ${s.problema_casa.enunciado.replace(/\n/g,'<br>')}</p>`
    : '';

  const saberesWordHtml = (s.saberes && s.saberes.length)
    ? `<h3 style="font-size:12pt;color:#223A5E;">Saberes trabajados</h3><ul>` + s.saberes.map(txt => `<li>${txt}</li>`).join('') + `</ul>`
    : '';

  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8">
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->
<style>@page { margin: 0.6in; } body { margin: 0; }</style>
</head>
<body style="font-family:Calibri,Arial,sans-serif;font-size:11pt;">
<table style="border-collapse:collapse;width:100%;margin-bottom:10pt;" cellspacing="0" cellpadding="0" border="0">
<tr>
  <td style="width:60pt;vertical-align:middle;"><img src="data:image/png;base64,${LOGO_B64_JS}" width="50"></td>
  <td style="vertical-align:middle;">
    <div style="font-size:15pt;font-weight:bold;color:#223A5E;">${UNIT1.title} · Sesión ${s.n}</div>
    <div style="font-size:12pt;">${s.name}</div>
    <div style="font-size:10pt;color:#5B5450;">${fecha} · Matemáticas, 6.º Primaria</div>
  </td>
</tr>
</table>
<hr style="border:none;border-top:1pt solid #000;margin-bottom:10pt;">
${calculoHtml}
<h3 style="font-size:12pt;color:#223A5E;">Ejercicios</h3>
${ejerciciosHtml}
${problemaHtml}
${saberesWordHtml}
${infografiaHtml}
</body></html>`;

  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${UNIT1.title.replace(/\s+/g,'')}_Sesion${n}_${(st.fecha || s.fecha)}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

ensureSAShadowSessions();
renderNav();
renderUnit();

let resizeTitleTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTitleTimer);
  resizeTitleTimer = setTimeout(() => fitTitleToOneLine(document.getElementById('unitTitle')), 150);
});

</script>
</body>
</html>
