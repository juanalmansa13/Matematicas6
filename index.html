 para casa."}, {"code": "8.3", "label": "Comunicar razonamientos espaciales con precisión.", "evidence": "Problemas, explicación y autoevaluación."}], "rubrica": null, "infografia_unidad_b64": "images/img_6daae42d71ba.webp"}, "ud9": {"title": "Unidad 9 · Estadística y probabilidad", "subtitle": "Tablas, gráficos, medidas estadísticas y probabilidad", "trimestre": "3.er trimestre", "sessions": [{"n": 1, "name": "Tablas de frecuencias", "calculo_diario": {"sumas": [["5 213 + 3 748", "8 961"], ["21 405 + 8 692", "30 097"]], "restas": [["9 316 − 4 578", "4 738"], ["36 210 − 15 876", "20 334"]], "mult": [["573 × 4", "2 292"], ["1 248 × 6", "7 488"]], "div": [["6 912 ÷ 4", "1 728"], ["8 415 ÷ 9", "935"]]}, "teoria": "Un estudio estadístico empieza formulando una pregunta clara: ¿qué queremos averiguar? Después se recogen los datos mediante una encuesta, una medición o una observación.\n\nLa frecuencia absoluta es el número de veces que se repite un dato. La frecuencia relativa es la frecuencia absoluta dividida entre el total (se puede expresar en decimal o en porcentaje).\n\nLa suma de todas las frecuencias relativas de una tabla siempre es 1 (el 100%).", "ejercicios": [{"enunciado": "Con los datos del ejemplo (fútbol 8, baloncesto 5, natación 4, atletismo 3), calcula la frecuencia relativa de cada deporte:", "items": ["fútbol", "baloncesto", "natación", "atletismo", "comprueba que las 4 frecuencias relativas suman 1"], "solucion": "a) 8/20 = 0,40 (40%)<br>b) 5/20 = 0,25 (25%)<br>c) 4/20 = 0,20 (20%)<br>d) 3/20 = 0,15 (15%)<br>e) 0,40+0,25+0,20+0,15 = 1 ✓"}, {"enunciado": "Se pregunta a 25 alumnos su color favorito: azul 10, rojo 6, verde 5, amarillo 4. Construye la tabla de frecuencias absolutas y relativas.", "items": ["azul", "rojo", "verde", "amarillo", "comprueba el total"], "solucion": "a) absoluta 10, relativa 10/25 = 0,40<br>b) absoluta 6, relativa 6/25 = 0,24<br>c) absoluta 5, relativa 5/25 = 0,20<br>d) absoluta 4, relativa 4/25 = 0,16<br>e) 10+6+5+4 = 25 ✓"}, {"enunciado": "Responde verdadero (V) o falso (F):", "items": ["La frecuencia absoluta puede ser mayor que el total de datos.", "La frecuencia relativa siempre está entre 0 y 1.", "El color favorito es un dato cuantitativo.", "La suma de todas las frecuencias relativas de una tabla es 1.", "La altura de una persona es un dato cualitativo."], "solucion": "a) F — nunca puede ser mayor que el total<br>b) V<br>c) F — es cualitativo (no es un número)<br>d) V<br>e) F — es cuantitativa (es un número)"}, {"enunciado": "Corrige el error: \"si pregunto a 10 compañeros y a 6 les gusta el fútbol, la frecuencia relativa del fútbol es 6\" (¿qué falta en ese razonamiento?)", "items": ["¿Cuál es el error y cuál sería la frecuencia relativa correcta?"], "solucion": "6 es la frecuencia absoluta, no la relativa. Falta dividir entre el total: la frecuencia relativa es 6/10 = 0,6 (60%)."}, {"enunciado": "En una encuesta sobre mascotas a 20 alumnos: perro 10, gato 6, pez 3, otros 1. Calcula la frecuencia relativa de \"otros\".", "items": ["Frecuencia relativa de otros"], "solucion": "1/20 = 0,05 (5%)"}, {"enunciado": "Clasifica cada dato como cualitativo o cuantitativo:", "items": ["estatura de un alumno", "color de ojos", "número de hermanos", "deporte favorito", "nota de un examen"], "solucion": "a) cuantitativo<br>b) cualitativo<br>c) cuantitativo<br>d) cualitativo<br>e) cuantitativo"}, {"enunciado": "Escribe 2 o 3 líneas explicando con tus palabras la diferencia entre frecuencia absoluta y frecuencia relativa.", "items": ["Explica la diferencia"], "solucion": "La frecuencia absoluta es el número de veces que aparece un dato (un número entero). La frecuencia relativa compara esa cantidad con el total de datos, expresándola como fracción, decimal o porcentaje, para saber qué proporción representa."}, {"enunciado": "Se han contado 15 coches por su color al pasar por la puerta del cole: rojo 6, blanco 5, negro 3, azul 1. Construye su tabla de frecuencias absolutas y relativas.", "items": ["rojo", "blanco", "negro", "azul", "comprueba el total"], "solucion": "a) absoluta 6, relativa 6/15 = 0,40<br>b) absoluta 5, relativa 5/15 ≈ 0,33<br>c) absoluta 3, relativa 3/15 = 0,20<br>d) absoluta 1, relativa 1/15 ≈ 0,07<br>e) 6+5+3+1 = 15 ✓"}], "problema_casa": {"enunciado": "Pregunta a 10 personas de tu familia o vecinos cuál es su fruta favorita. Construye tu propia tabla de frecuencias absolutas y relativas.", "solucion": "Respuesta abierta según los datos recogidos: la tabla debe mostrar cada fruta con su frecuencia absoluta (nº de personas) y su frecuencia relativa (absoluta ÷ 10), comprobando que las frecuencias relativas suman 1."}, "infografia_b64": "images/img_0f28a57dabda.webp", "fecha": "2027-01-13", "saberes": ["Conjuntos de datos y gráficos estadísticos de la vida cotidiana: descripción, interpretación y análisis crítico."], "pra": {"teoria": "Una tabla de frecuencias cuenta cuántas veces se repite cada dato. La frecuencia absoluta es ese número de veces.\n\nVamos a practicar solo contando y sumando frecuencias sencillas.", "ejercicios": [{"enunciado": "Con estos datos (fútbol 5, baloncesto 3, natación 2), responde.", "items": ["frecuencia de fútbol", "frecuencia de baloncesto", "frecuencia de natación", "total de datos", "deporte más elegido"], "solucion": "a) 5 · b) 3 · c) 2 · d) 10 · e) fútbol"}, {"enunciado": "Suma las frecuencias para hallar el total.", "items": ["4+3+2", "5+5", "6+2+2", "3+3+3", "10+5"], "solucion": "a) 9 · b) 10 · c) 10 · d) 9 · e) 15"}, {"enunciado": "¿Cuál es el dato más frecuente (el que más se repite)?", "items": ["rojo 5, azul 3, verde 2", "perro 8, gato 4", "sí 6, no 2", "grande 3, mediano 5, pequeño 2", "lunes 2, martes 4, miércoles 1"], "solucion": "a) rojo · b) perro · c) sí · d) mediano · e) martes"}, {"enunciado": "Completa la tabla con la frecuencia que falta (total 10).", "items": ["A=4, B=3, C=___", "A=5, B=___, total=8", "A=2, B=2, C=2, D=___, total=10", "A=6, B=___, total=10", "A=1, B=1, C=___, total=5"], "solucion": "a) 3 · b) 3 · c) 4 · d) 4 · e) 3"}, {"enunciado": "Verdadero o falso.", "items": ["La frecuencia absoluta cuenta cuántas veces se repite un dato.", "La suma de las frecuencias es siempre 0.", "Una tabla de frecuencias organiza datos.", "El dato con más frecuencia es el menos elegido.", "5+3+2=10."], "solucion": "a) V · b) F · c) V · d) F · e) F (10)"}]}}, {"n": 2, "name": "Barras y sectores", "calculo_diario": {"sumas": [["4 512 + 2 879", "7 391"], ["36 500 + 18 250", "54 750"]], "restas": [["6 003 − 2 746", "3 257"], ["40 000 − 17 800", "22 200"]], "mult": [["215 × 7", "1 505"], ["35 × 4", "140"]], "div": [["1 512 ÷ 8", "189"], ["63 600 ÷ 4", "15 900"]]}, "teoria": "El diagrama de barras representa cada categoría con una barra cuya altura es su frecuencia. El diagrama de sectores reparte un círculo en porciones proporcionales a la frecuencia relativa de cada categoría.\n\nAmbos se construyen a partir de la misma tabla de frecuencias, solo cambia la forma de representarla.\n\nPor ejemplo, si el fútbol tiene una frecuencia relativa del 40%, ocupará el 40% del círculo en el diagrama de sectores.", "ejercicios": [{"enunciado": "Observando el diagrama de barras: ¿cuántos alumnos más eligieron fútbol que natación?", "items": ["Diferencia entre fútbol y natación"], "solucion": "8 − 4 = 4 alumnos más"}, {"enunciado": "Observando el diagrama de sectores: ¿qué porcentaje representan juntos baloncesto y natación?", "items": ["Porcentaje conjunto"], "solucion": "25% + 20% = 45%"}, {"enunciado": "En una encuesta sobre el medio de transporte al cole: andando 12, coche 6, autobús 4, bici 3. Responde:", "items": ["¿cuál es el medio más usado?", "¿cuántos alumnos participaron en la encuesta?", "¿qué gráfico usarías si quieres ver qué % anda al cole?", "¿qué gráfico usarías si solo quieres comparar cuántos usan cada medio?", "calcula la frecuencia relativa de \"bici\""], "solucion": "a) andando<br>b) 12+6+4+3 = 25 alumnos<br>c) diagrama de sectores<br>d) diagrama de barras<br>e) 3/25 = 0,12 (12%)"}, {"enunciado": "Responde verdadero (V) o falso (F):", "items": ["En un diagrama de sectores, los porcentajes de todas las porciones suman 100%.", "Un diagrama de barras puede tener barras de distinto color.", "El diagrama de sectores sirve mejor para ver la evolución de un dato en el tiempo.", "El diagrama de barras y el de sectores pueden representar la misma tabla.", "Cuantas más categorías tenga un dato, más fácil es leerlo en un sector muy pequeño."], "solucion": "a) V<br>b) V<br>c) F — para eso es mejor un gráfico de líneas<br>d) V<br>e) F — más categorías hace más difícil leer sectores pequeños"}, {"enunciado": "Corrige el error: un compañero dibuja un diagrama de sectores donde los porcentajes suman 120%. ¿Qué ha ocurrido?", "items": ["¿Cuál es el error?"], "solucion": "Ha calculado mal algún porcentaje o ha contado datos de más; los porcentajes de un diagrama de sectores siempre deben sumar exactamente 100%."}, {"enunciado": "Escribe un ejemplo de pregunta para la que usarías mejor un diagrama de barras que uno de sectores, y explica por qué.", "items": ["Ejemplo y justificación"], "solucion": "Respuesta libre, por ejemplo: «¿Cuántos goles marcó cada jugador?» — un diagrama de barras es mejor porque permite comparar cantidades exactas fácilmente, mientras que el de sectores se centra en porcentajes del total."}, {"enunciado": "En un gráfico de sectores sobre el destino de vacaciones de 40 alumnos, \"playa\" ocupa el 50%. ¿Cuántos alumnos eligieron la playa?", "items": ["Número de alumnos"], "solucion": "50% de 40 = 20 alumnos"}, {"enunciado": "Con los datos de mochilas (negro 9, azul 7, rosa 4), indica qué altura tendría cada barra en un diagrama de barras y qué % ocuparía cada una en uno de sectores.", "items": ["negro", "azul", "rosa"], "solucion": "a) altura 9, 9/20 = 45%<br>b) altura 7, 7/20 = 35%<br>c) altura 4, 4/20 = 20%"}], "problema_casa": {"enunciado": "Haz una pequeña encuesta en casa (por ejemplo, la bebida favorita) y decide qué tipo de gráfico usarías para representarla. Justifica tu elección.", "solucion": "Respuesta abierta: si el objetivo es comparar cantidades exactas, mejor un diagrama de barras; si el objetivo es ver qué proporción del total representa cada bebida, mejor un diagrama de sectores."}, "infografia_b64": "images/img_7260dec5cb46.webp", "fecha": "2027-01-14", "saberes": ["Gráficos estadísticos sencillos (diagrama de barras, diagrama de sectores, histograma, etc.): representación de datos mediante recursos tradicionales y tecnológicos y selección del más conveniente."], "pra": {"teoria": "El diagrama de barras representa los datos con barras: cuanto más alta la barra, más veces se repite ese dato.\n\nVamos a practicar leyendo barras muy sencillas.", "ejercicios": [{"enunciado": "Con estas alturas de barra (fútbol 8, baloncesto 5, natación 3), responde.", "items": ["¿qué barra es más alta?", "¿qué barra es más baja?", "diferencia entre la más alta y la más baja", "¿cuál mide más que baloncesto?", "suma de las tres barras"], "solucion": "a) fútbol · b) natación · c) 5 · d) fútbol · e) 16"}, {"enunciado": "Ordena estas alturas de mayor a menor.", "items": ["3, 8, 5", "10, 2, 6", "4, 4, 7", "9, 1, 5", "6, 6, 3"], "solucion": "a) 8, 5, 3 · b) 10, 6, 2 · c) 7, 4, 4 · d) 9, 5, 1 · e) 6, 6, 3"}, {"enunciado": "¿Cuál es la diferencia entre estas dos barras?", "items": ["8 y 3", "10 y 4", "6 y 6", "9 y 2", "7 y 5"], "solucion": "a) 5 · b) 6 · c) 0 · d) 7 · e) 2"}, {"enunciado": "Verdadero o falso.", "items": ["Una barra más alta significa más frecuencia.", "Todas las barras deben medir lo mismo.", "El diagrama de barras sirve para representar datos.", "Se puede leer qué dato es el más frecuente mirando la barra más alta.", "Las barras no tienen relación con los números de la tabla."], "solucion": "a) V · b) F · c) V · d) V · e) F"}, {"enunciado": "¿Qué dato es el más usado o elegido según estos casos?", "items": ["andando 10, coche 6, bici 4", "fútbol 8, baloncesto 5, natación 3", "rojo 5, azul 3, verde 2", "sí 6, no 2", "perro 8, gato 4"], "solucion": "a) andando · b) fútbol · c) rojo · d) sí · e) perro"}]}}, {"n": 3, "name": "El histograma", "calculo_diario": {"sumas": [["7 208 + 1 396", "8 604"], ["52 750 + 13 400", "66 150"]], "restas": [["9 005 − 3 618", "5 387"], ["80 000 − 24 600", "55 400"]], "mult": [["342 × 9", "3 078"], ["123 × 5", "615"]], "div": [["2 436 ÷ 6", "406"], ["84 500 ÷ 5", "16 900"]]}, "teoria": "El histograma se usa para datos cuantitativos continuos agrupados en intervalos; a diferencia del diagrama de barras, sus barras van pegadas (sin separación), porque los intervalos son continuos.\n\nDiferencia con el diagrama de barras: en las barras hay categorías separadas; en el histograma, intervalos continuos.\n\nPara elegir el gráfico adecuado: categorías → barras o sectores; datos numéricos agrupados en intervalos → histograma. Una hoja de cálculo ayuda a organizar muchos datos.", "ejercicios": [{"enunciado": "Observando el histograma: ¿cuántos alumnos tardaron entre 10 y 11 segundos? ¿Y menos de 10 segundos en total?", "items": ["Entre 10 y 11 segundos", "Menos de 10 segundos"], "solucion": "Respuesta según el histograma mostrado en la infografía (léelo directamente en las barras correspondientes)."}, {"enunciado": "Se han medido los pesos (kg) de 20 mochilas, agrupados así: 2-3kg → 4, 3-4kg → 11, 4-5kg → 5. Responde:", "items": ["¿cuántas mochilas se han medido?", "¿qué intervalo es el más frecuente?", "¿por qué se usa un histograma y no un diagrama de barras?"], "solucion": "a) 4+11+5 = 20 mochilas<br>b) 3-4 kg (11 mochilas)<br>c) porque el peso es un dato continuo agrupado en intervalos, no categorías separadas"}, {"enunciado": "Responde verdadero (V) o falso (F):", "items": ["En un histograma las barras se dibujan siempre pegadas.", "Un histograma se usa para datos cualitativos como el color favorito.", "Un diagrama de barras se usa para categorías, no para intervalos.", "Una hoja de cálculo puede ayudar a organizar muchos datos.", "Un histograma y un diagrama de barras se ven siempre exactamente igual."], "solucion": "a) V<br>b) F — se usa para datos cuantitativos continuos<br>c) V<br>d) V<br>e) F — el histograma tiene las barras pegadas"}, {"enunciado": "Indica qué gráfico usarías (barras, sectores o histograma) para cada situación:", "items": ["las alturas de 30 plantas agrupadas en intervalos de 5 cm", "el color de camiseta favorito de la clase", "qué % del recreo pasan en cada actividad", "el número de goles marcados por 5 equipos distintos", "el peso de 40 sandías agrupado en intervalos de 1 kg"], "solucion": "a) histograma<br>b) barras o sectores<br>c) sectores<br>d) barras<br>e) histograma"}, {"enunciado": "Corrige el error: un alumno dibuja un histograma dejando un hueco entre cada barra. ¿Por qué no es correcto?", "items": ["Explica el error"], "solucion": "En un histograma las barras deben ir pegadas, porque representan intervalos continuos sin espacios entre ellos (a diferencia del diagrama de barras, donde sí hay separación entre categorías)."}, {"enunciado": "Explica con tus palabras la diferencia entre un diagrama de barras y un histograma.", "items": ["Explica la diferencia"], "solucion": "El diagrama de barras representa categorías separadas (como colores o deportes), con las barras separadas entre sí. El histograma representa datos numéricos continuos agrupados en intervalos, con las barras pegadas."}, {"enunciado": "¿Qué ventaja tiene usar una hoja de cálculo para organizar datos estadísticos frente a hacerlo a mano?", "items": ["Ventaja"], "solucion": "Permite organizar, ordenar y calcular automáticamente frecuencias, medias u otros valores con muchos datos, evitando errores de cálculo y ahorrando tiempo."}, {"enunciado": "Estas son las alturas (cm) de 15 plantas: 12, 18, 15, 22, 14, 19, 16, 25, 13, 20, 17, 24, 15, 21, 18. Agrúpalas en 3 intervalos (10-15, 15-20, 20-25) y cuenta cuántas caen en cada uno.", "items": ["10-15", "15-20", "20-25"], "solucion": "a) 3 plantas (12,14,13)<br>b) 7 plantas (18,15,19,16,15,17,18)<br>c) 5 plantas (22,25,20,24,21)"}], "problema_casa": {"enunciado": "Anota cuánto tiempo pasas viendo la tele o el móvil cada día durante una semana, y agrupa tus datos en 2 o 3 intervalos.", "solucion": "Respuesta abierta según los datos recogidos: se deben definir 2 o 3 intervalos de tiempo (por ejemplo, 0-1h, 1-2h, 2-3h) y contar cuántos días caen en cada uno."}, "infografia_b64": "images/img_f84105adb904.webp", "fecha": "2027-01-15", "saberes": ["Gráficos estadísticos sencillos (diagrama de barras, diagrama de sectores, histograma, etc.): representación de datos mediante recursos tradicionales y tecnológicos y selección del más conveniente."], "pra": {"teoria": "El diagrama de sectores reparte un círculo en porciones. Cuanto más grande es la porción, más frecuente es ese dato.\n\nVamos a practicar solo con porcentajes muy sencillos: 50%, 25% y 100%.", "ejercicios": [{"enunciado": "¿Qué porción es más grande?", "items": ["50% o 25%", "100% o 50%", "25% o 10%", "75% o 50%", "10% o 5%"], "solucion": "a) 50% · b) 100% · c) 25% · d) 75% · e) 10%"}, {"enunciado": "Si el 50% de 20 alumnos eligió fútbol, ¿cuántos son?", "items": ["50% de 20", "25% de 20", "50% de 10", "100% de 20", "25% de 40"], "solucion": "a) 10 · b) 5 · c) 5 · d) 20 · e) 10"}, {"enunciado": "¿Cuánto suman todos los sectores de un diagrama circular?", "items": ["si hay 3 sectores de 50%, 30% y 20%, ¿cuánto suman?", "si hay 2 sectores de 60% y 40%, ¿cuánto suman?", "si hay 4 sectores iguales, ¿cuánto vale cada uno?", "si hay 2 sectores iguales, ¿cuánto vale cada uno?", "en general, ¿cuánto deben sumar siempre los sectores?"], "solucion": "a) 100% · b) 100% · c) 25% · d) 50% · e) 100%"}, {"enunciado": "Completa el porcentaje que falta para llegar a 100%.", "items": ["50%+___=100%", "25%+75%=___", "40%+___=100%", "20%+30%+___=100%", "60%+___=100%"], "solucion": "a) 50 · b) 100 · c) 60 · d) 50 · e) 40"}, {"enunciado": "Verdadero o falso.", "items": ["Un diagrama de sectores es un círculo.", "Los sectores suman 100%.", "La porción más grande representa el dato más frecuente.", "50% es la mitad del círculo.", "100% es una parte pequeña del círculo."], "solucion": "a) V · b) V · c) V · d) V · e) F"}]}}, {"n": 4, "name": "Media y moda", "calculo_diario": {"sumas": [["5 847 + 3 265", "9 112"], ["27 080 + 9 500", "36 580"]], "restas": [["8 401 − 2 756", "5 645"], ["60 000 − 13 250", "46 750"]], "mult": [["418 × 6", "2 508"], ["92 × 7", "644"]], "div": [["3 192 ÷ 8", "399"], ["72 400 ÷ 4", "18 100"]]}, "teoria": "La media se calcula sumando todos los datos y dividiendo entre el número de datos.\n\nLa moda es el dato que más veces se repite. Puede haber varias modas, o ninguna, si todos los datos son distintos.\n\nMedia y moda no tienen por qué coincidir: son dos formas distintas de resumir un conjunto de datos.", "ejercicios": [{"enunciado": "Comprueba el cálculo de la media de goles del ejemplo (17÷10) y confirma que la moda es 1.", "items": ["Comprueba media y moda"], "solucion": "17÷10 = 1,7 (correcto). La moda es 1 si ese valor se repite más veces que cualquier otro en el conjunto de datos del ejemplo."}, {"enunciado": "Estas son las notas de un examen: 7, 6, 8, 7, 9, 7, 6, 10. Calcula:", "items": ["la suma de todas las notas", "la media", "la moda"], "solucion": "a) 7+6+8+7+9+7+6+10 = 60<br>b) 60÷8 = 7,5<br>c) 7 (se repite 3 veces)"}, {"enunciado": "Responde verdadero (V) o falso (F):", "items": ["La media siempre es uno de los datos originales.", "La moda puede no existir si todos los datos son distintos.", "Puede haber más de una moda en un mismo conjunto.", "Para calcular la media hay que dividir la suma entre el número de datos.", "La moda siempre coincide con la media."], "solucion": "a) F — puede no coincidir con ningún dato<br>b) V<br>c) V<br>d) V<br>e) F — no tienen por qué coincidir"}, {"enunciado": "Corrige el error: un alumno calcula la media de 5 datos sumándolos y dividiendo entre 4. ¿Qué ha hecho mal?", "items": ["¿Cuál es el error?"], "solucion": "Debe dividir entre el número de datos que hay (5), no entre 4; ha contado mal cuántos datos tiene."}, {"enunciado": "¿En qué situación te parece más útil conocer la moda que la media? Pon un ejemplo.", "items": ["Ejemplo"], "solucion": "Respuesta libre, por ejemplo: para saber la talla de ropa más vendida en una tienda, interesa más la moda (la talla que más se repite) que la media (que podría no ser una talla real)."}, {"enunciado": "Estas son las temperaturas (ºC) de 6 días: 22, 25, 22, 19, 25, 21. Calcula la media y di si hay una o dos modas.", "items": ["Media y moda"], "solucion": "Media: (22+25+22+19+25+21)÷6 = 134÷6 ≈ 22,33 ºC. Hay dos modas: 22 y 25 (ambas se repiten 2 veces)."}, {"enunciado": "Los precios (€) de 5 bocadillos son: 2, 3, 2, 2, 4. Calcula la media y la moda.", "items": ["Media y moda"], "solucion": "Media: (2+3+2+2+4)÷5 = 13÷5 = 2,6 €. Moda: 2 € (se repite 3 veces)."}, {"enunciado": "Inventa un conjunto de 6 datos que tenga exactamente dos modas.", "items": ["Inventa el conjunto"], "solucion": "Respuesta libre, por ejemplo: 3, 3, 5, 5, 7, 8 (modas 3 y 5, ambas se repiten 2 veces)."}], "problema_casa": {"enunciado": "Recoge un dato tuyo cada día durante una semana (por ejemplo, mensajes recibidos) y calcula su media y su moda.", "solucion": "Respuesta abierta según los datos recogidos: la media se calcula sumando los 7 valores y dividiendo entre 7; la moda es el valor que más se repite (si lo hay)."}, "infografia_b64": "images/img_b88aebfd5d22.webp", "fecha": "2027-01-18", "saberes": ["Medidas de centralización (media y moda): interpretación, cálculo y aplicación."], "pra": {"teoria": "La media se calcula sumando todos los datos y dividiendo entre cuántos datos hay. La moda es el dato que más se repite.\n\nVamos a practicar solo con pocos datos y números pequeños.", "ejercicios": [{"enunciado": "Calcula la media.", "items": ["4, 6, 8", "2, 2, 2", "5, 5, 10", "1, 3, 5, 7", "10, 20, 30"], "solucion": "a) 6 · b) 2 · c) 6,67 · d) 4 · e) 20"}, {"enunciado": "Calcula la moda (el dato que más se repite).", "items": ["3, 5, 5, 7", "2, 2, 2, 4", "1, 2, 3, 4", "6, 6, 8, 8, 6", "9, 9, 5, 5, 5"], "solucion": "a) 5 · b) 2 · c) no hay moda · d) 6 · e) 5"}, {"enunciado": "Suma los datos antes de calcular la media.", "items": ["4+6+8", "2+2+2", "5+5+10", "1+3+5+7", "10+20+30"], "solucion": "a) 18 · b) 6 · c) 20 · d) 16 · e) 60"}, {"enunciado": "¿Cuántos datos hay en cada lista?", "items": ["4, 6, 8", "2, 2, 2", "1, 3, 5, 7", "10, 20, 30, 40", "5, 5"], "solucion": "a) 3 · b) 3 · c) 4 · d) 4 · e) 2"}, {"enunciado": "Verdadero o falso.", "items": ["La media se calcula sumando y dividiendo.", "La moda es el número más grande.", "3, 5, 5, 7 tiene moda 5.", "La media de 2, 2, 2 es 2.", "Puede no haber moda si todos los datos son distintos."], "solucion": "a) V · b) F · c) V · d) V · e) V"}]}}, {"n": 5, "name": "El rango", "calculo_diario": {"sumas": [["6 375 + 2 958", "9 333"], ["45 600 + 8 750", "54 350"]], "restas": [["7 500 − 3 842", "3 658"], ["50 000 − 16 400", "33 600"]], "mult": [["256 × 9", "2 304"], ["64 × 8", "512"]], "div": [["4 032 ÷ 7", "576"], ["91 800 ÷ 6", "15 300"]]}, "teoria": "El rango es una medida de dispersión: máximo − mínimo. Nos dice cuánto varían los datos.\n\nUn rango pequeño indica que los datos están agrupados, son parecidos entre sí. Un rango grande indica que hay mucha diferencia entre los valores extremos.\n\nPara comparar dos conjuntos de datos, a partir de su rango podemos ver cuál varía más o cuál tiene valores más altos, aunque tengan la misma media.", "ejercicios": [{"enunciado": "Comprueba el rango de las temperaturas de Sevilla y de La Línea de la gráfica. ¿Cuál varía más?", "items": ["Rango de cada ciudad y cuál varía más"], "solucion": "Respuesta según los datos de la gráfica: la ciudad con mayor diferencia entre su temperatura máxima y mínima es la que tiene mayor rango y, por tanto, varía más."}, {"enunciado": "Dos equipos marcaron estos goles en 6 jornadas — Equipo A: 2,1,3,0,2,4. Equipo B: 1,2,1,2,1,2. Calcula:", "items": ["el rango del Equipo A", "el rango del Equipo B", "¿qué equipo es más regular?"], "solucion": "a) máximo 4, mínimo 0 → rango = 4<br>b) máximo 2, mínimo 1 → rango = 1<br>c) el Equipo B, porque tiene menor rango (varía menos)"}, {"enunciado": "Responde verdadero (V) o falso (F):", "items": ["El rango se calcula sumando el máximo y el mínimo.", "Un rango pequeño indica que los datos son parecidos entre sí.", "El rango puede dar un número negativo.", "Dos conjuntos de datos pueden tener la misma media y distinto rango.", "El rango solo se puede calcular con datos cuantitativos."], "solucion": "a) F — se calcula restando (máximo − mínimo)<br>b) V<br>c) F — nunca es negativo<br>d) V<br>e) V"}, {"enunciado": "Corrige el error: un alumno calcula el rango de 12, 18, 15, 9 como \"12+9=21\". ¿Cuál es el rango correcto?", "items": ["Rango correcto"], "solucion": "El rango es máximo − mínimo, no una suma cualquiera: 18 − 9 = 9."}, {"enunciado": "¿Qué nos indica que un conjunto de datos tenga un rango muy grande?", "items": ["Explica"], "solucion": "Que hay mucha diferencia entre el valor más alto y el más bajo, es decir, que los datos son muy variados o dispersos."}, {"enunciado": "Estas son las edades de 5 primos: 8, 15, 10, 22, 12. Halla el máximo, el mínimo y el rango.", "items": ["Máximo, mínimo y rango"], "solucion": "Máximo: 22. Mínimo: 8. Rango: 22 − 8 = 14."}, {"enunciado": "Las notas de dos exámenes fueron — Examen 1: 5,6,7,6,8,7. Examen 2: 2,10,3,9,10,5. Calcula la media y el rango de cada uno y explica qué examen fue más parejo aunque la media sea igual.", "items": ["media examen 1", "rango examen 1", "media examen 2", "rango examen 2", "conclusión"], "solucion": "a) (5+6+7+6+8+7)÷6 = 39÷6 = 6,5<br>b) 8−5 = 3<br>c) (2+10+3+9+10+5)÷6 = 39÷6 = 6,5<br>d) 10−2 = 8<br>e) el Examen 1 fue más parejo (rango 3 frente a 8), aunque ambas medias sean 6,5"}, {"enunciado": "Inventa un conjunto de 5 datos cuyo rango sea exactamente 10.", "items": ["Inventa el conjunto"], "solucion": "Respuesta libre, por ejemplo: 3, 5, 8, 9, 13 (rango = 13 − 3 = 10)."}], "problema_casa": {"enunciado": "Compara la temperatura máxima de tu localidad durante dos semanas distintas (o dos ciudades) y calcula el rango de cada una.", "solucion": "Respuesta abierta según los datos recogidos: el rango de cada semana (o ciudad) se calcula restando la temperatura mínima de la máxima registrada en ese periodo."}, "infografia_b64": "images/img_a3a0ae6d8909.webp", "fecha": "2027-01-19", "saberes": ["Medidas de dispersión (rango): cálculo e interpretación."], "pra": {"teoria": "El rango es la diferencia entre el dato más grande y el más pequeño: rango = máximo − mínimo. Nos dice si los datos están muy juntos o muy separados.\n\nVamos a practicar con listas de pocos números pequeños.", "ejercicios": [{"enunciado": "Calcula el rango (máximo − mínimo).", "items": ["4, 6, 8", "2, 5, 9", "10, 3, 7", "1, 1, 1", "5, 15, 10"], "solucion": "a) 4 · b) 7 · c) 7 · d) 0 · e) 10"}, {"enunciado": "Encuentra el máximo y el mínimo de cada lista.", "items": ["3, 7, 5", "8, 2, 6", "10, 1, 5", "4, 4, 4", "9, 3, 6"], "solucion": "a) máx 7, mín 3 · b) máx 8, mín 2 · c) máx 10, mín 1 · d) máx 4, mín 4 · e) máx 9, mín 3"}, {"enunciado": "¿Qué lista tiene mayor rango?", "items": ["3,5,7 o 1,5,20", "2,2,2 o 1,5,9", "10,12 o 10,50", "4,6 o 4,4", "3,8 o 3,3"], "solucion": "a) 1,5,20 · b) 1,5,9 · c) 10,50 · d) 4,6 · e) 3,8"}, {"enunciado": "Si el rango es 0, ¿qué significa? Comprueba en cada caso.", "items": ["2, 2, 2", "5, 5, 5, 5", "3, 3", "1, 1, 1, 1, 1", "en general, rango 0"], "solucion": "a) todos son iguales, rango 0 · b) todos son iguales, rango 0 · c) todos son iguales, rango 0 · d) todos son iguales, rango 0 · e) significa que todos los datos son iguales"}, {"enunciado": "Verdadero o falso.", "items": ["El rango es máximo menos mínimo.", "Un rango pequeño indica datos muy distintos.", "El rango de 1,1,1 es 0.", "El rango nunca puede ser 0.", "Un rango grande indica que los datos varían mucho."], "solucion": "a) V · b) F · c) V · d) F · e) V"}]}}, {"n": 6, "name": "La probabilidad", "calculo_diario": {"sumas": [["8 164 + 2 739", "10 903"], ["33 250 + 7 800", "41 050"]], "restas": [["9 203 − 4 567", "4 636"], ["70 000 − 28 600", "41 400"]], "mult": [["329 × 8", "2 632"], ["56 × 9", "504"]], "div": [["3 648 ÷ 6", "608"], ["68 400 ÷ 4", "17 100"]]}, "teoria": "Un suceso aleatorio es una situación en la que no sabemos con seguridad qué va a pasar.\n\nLa regla de Laplace: cuando todos los resultados son igual de probables, la probabilidad = casos favorables ÷ casos posibles.\n\nPor ejemplo, al lanzar un dado, P(sacar un 5) = 1/6; P(número par) = 3/6 = 1/2.\n\nLa probabilidad va siempre de 0 (imposible) a 1 (seguro).", "ejercicios": [{"enunciado": "Con un dado, calcula la probabilidad de sacar un número impar y la de sacar un 1 o un 6.", "items": ["P(número impar)", "P(1 o 6)"], "solucion": "a) 3/6 = 1/2<br>b) 2/6 = 1/3"}, {"enunciado": "Al lanzar una moneda, calcula P(cara) y P(cruz). ¿Por qué son iguales?", "items": ["P(cara), P(cruz) y por qué"], "solucion": "P(cara) = 1/2, P(cruz) = 1/2. Son iguales porque hay 2 resultados posibles igual de probables (1 caso favorable de 2 posibles en cada caso)."}, {"enunciado": "En una bolsa hay 6 bolas: 3 moradas, 2 turquesas y 1 ámbar. Calcula:", "items": ["P(morada)", "P(turquesa)", "P(ámbar)", "P(no salga ámbar)"], "solucion": "a) 3/6 = 1/2<br>b) 2/6 = 1/3<br>c) 1/6<br>d) 5/6 (1 − 1/6)"}, {"enunciado": "Responde verdadero (V) o falso (F):", "items": ["La suma de las probabilidades de todos los resultados posibles es 1.", "Un suceso imposible tiene probabilidad 1.", "Un suceso seguro tiene probabilidad 1.", "La probabilidad de un suceso siempre está entre 0 y 1.", "Cuantos más casos favorables haya, menor es la probabilidad."], "solucion": "a) V<br>b) F — tiene probabilidad 0<br>c) V<br>d) V<br>e) F — a más casos favorables, mayor es la probabilidad"}, {"enunciado": "Corrige el error: un compañero dice \"la probabilidad de sacar un 7 en un dado de 6 caras es 1/6\". ¿Cuál es el error?", "items": ["¿Cuál es el error?"], "solucion": "Sacar un 7 en un dado de 6 caras es un suceso imposible (no existe esa cara), así que su probabilidad es 0, no 1/6."}, {"enunciado": "Explica por qué un suceso imposible tiene probabilidad 0 y uno seguro tiene probabilidad 1.", "items": ["Explica"], "solucion": "Un suceso imposible tiene 0 casos favorables (0÷posibles=0). Un suceso seguro tiene tantos casos favorables como posibles (posibles÷posibles=1)."}, {"enunciado": "En una urna hay 10 bolas numeradas del 1 al 10. ¿Cuál es la probabilidad de sacar un número mayor que 7?", "items": ["P(mayor que 7)"], "solucion": "Casos favorables: 8, 9, 10 → 3/10"}, {"enunciado": "En la rifa del cole se venden 50 papeletas y tu familia compra 4. ¿Cuál es la probabilidad de que os toque? Exprésalo como fracción, decimal y porcentaje.", "items": ["Probabilidad en fracción, decimal y %"], "solucion": "4/50 = 2/25 = 0,08 = 8%"}], "problema_casa": {"enunciado": "Inventa tu propio experimento aleatorio con un dado, una moneda o unas canicas de casa, y calcula al menos dos probabilidades.", "solucion": "Respuesta abierta: debe aplicar la regla de Laplace (casos favorables ÷ casos posibles) al menos dos veces sobre el experimento elegido."}, "infografia_b64": "images/img_936ea6e7677c.webp", "fecha": "2027-01-20", "saberes": ["Cálculo de probabilidades en experimentos, comparaciones o investigaciones en los que sea aplicable la regla de Laplace: aplicación de técnicas básicas del conteo."], "pra": {"teoria": "La probabilidad mide qué tan posible es que ocurra algo. Se calcula: casos favorables ÷ casos posibles.\n\nVamos a practicar solo con una moneda (2 casos) y un dado (6 casos).", "ejercicios": [{"enunciado": "Al lanzar una moneda, calcula.", "items": ["P(cara)", "P(cruz)", "casos posibles en total", "P(cara o cruz)", "¿es más probable cara o cruz?"], "solucion": "a) 1/2 · b) 1/2 · c) 2 · d) 1 (segura) · e) igual de probables"}, {"enunciado": "Al lanzar un dado, calcula.", "items": ["P(sacar un 3)", "casos posibles en total", "P(sacar un número par: 2,4,6)", "P(sacar un 1 o un 2)", "P(sacar un 7)"], "solucion": "a) 1/6 · b) 6 · c) 3/6 = 1/2 · d) 2/6 = 1/3 · e) 0 (imposible)"}, {"enunciado": "En una bolsa con 3 bolas rojas y 2 azules, calcula.", "items": ["P(roja)", "P(azul)", "casos posibles en total", "¿cuál es más probable?", "P(roja o azul)"], "solucion": "a) 3/5 · b) 2/5 · c) 5 · d) roja · e) 1 (segura)"}, {"enunciado": "Verdadero o falso.", "items": ["La probabilidad se calcula casos favorables ÷ casos posibles.", "P(cara) al lanzar una moneda es 1/3.", "P(sacar un 7) en un dado es 0.", "La probabilidad de un suceso seguro es 1.", "Un dado tiene 6 casos posibles."], "solucion": "a) V · b) F (1/2) · c) V · d) V · e) V"}, {"enunciado": "Calcula la probabilidad.", "items": ["4 bolas: 2 rojas, 2 azules. P(roja)", "10 papeletas, compras 1. P(que te toque)", "un dado. P(sacar un número menor que 3: 1,2)", "una moneda lanzada 2 veces. P(cara en la primera)", "6 caramelos: 1 de menta. P(sacar el de menta)"], "solucion": "a) 2/4 = 1/2 · b) 1/10 · c) 2/6 = 1/3 · d) 1/2 · e) 1/6"}]}}, {"n": 7, "name": "Muestra y población", "calculo_diario": {"sumas": [["4 926 + 3 187", "8 113"], ["19 400 + 6 275", "25 675"]], "restas": [["8 312 − 5 649", "2 663"], ["90 500 − 37 250", "53 250"]], "mult": [["247 × 7", "1 729"], ["83 × 6", "498"]], "div": [["5 184 ÷ 8", "648"], ["57 600 ÷ 4", "14 400"]]}, "teoria": "La muestra es una parte representativa del grupo a la que preguntamos. La población es todo el grupo sobre el que queremos sacar conclusiones.\n\nLas conclusiones solo se pueden aplicar a la población si la muestra la representa bien.\n\nMuchos estudios sobre reciclaje, agua o huella ecológica (relacionados con los ODS) usan muestras de la población para sacar conclusiones sin tener que preguntar a todo el mundo.", "ejercicios": [{"enunciado": "Con el ejemplo de la encuesta sobre reciclaje (19 sí, 6 no de 25), calcula la frecuencia relativa del \"no\" y comprueba que suman 1.", "items": ["Frecuencia relativa de \"no\" y comprobación"], "solucion": "6/25 = 0,24 (24%). Comprobación: 19/25 + 6/25 = 25/25 = 1 ✓"}, {"enunciado": "Indica cuál es la muestra y cuál la población en cada situación:", "items": ["un médico analiza la tensión de 40 pacientes para conocer la salud del barrio", "se prueban 20 bombillas de una fábrica que produce 5.000 al día", "se pregunta a 100 turistas de una ciudad de 200.000 habitantes", "un profesor corrige 5 exámenes al azar de una clase de 25", "una tienda encuesta a 50 de los 3.000 clientes que tiene al mes"], "solucion": "a) muestra: 40 pacientes · población: el barrio<br>b) muestra: 20 bombillas · población: las 5.000 producidas al día<br>c) muestra: 100 turistas · población: los 200.000 habitantes<br>d) muestra: 5 exámenes · población: los 25 de la clase<br>e) muestra: 50 clientes · población: los 3.000 clientes al mes"}, {"enunciado": "Responde verdadero (V) o falso (F):", "items": ["La muestra siempre debe ser más grande que la población.", "Una muestra representativa permite generalizar a la población.", "Si la muestra está mal elegida, las conclusiones pueden ser erróneas.", "La población es el grupo completo sobre el que queremos concluir algo.", "Una encuesta a 5 amigos siempre representa a todo el colegio."], "solucion": "a) F — la muestra es siempre una parte (o igual), nunca mayor<br>b) V<br>c) V<br>d) V<br>e) F — 5 amigos no son representativos de todo el colegio"}, {"enunciado": "Corrige el error: un alumno dice que como sus 5 mejores amigos prefieren el fútbol, \"todo el colegio prefiere el fútbol\". ¿Qué ha hecho mal?", "items": ["¿Qué ha hecho mal?"], "solucion": "Ha generalizado a partir de una muestra demasiado pequeña y no representativa (solo sus amigos, que probablemente comparten sus mismos gustos)."}, {"enunciado": "Explica por qué es importante que una muestra sea representativa. Pon un ejemplo de una muestra mal elegida.", "items": ["Explicación y ejemplo"], "solucion": "Es importante porque, si no lo es, las conclusiones sobre la población entera pueden ser erróneas. Ejemplo de muestra mal elegida: preguntar solo a los alumnos de un equipo de fútbol sobre el deporte favorito de todo el colegio."}, {"enunciado": "En una muestra de 30 familias, 24 dicen que ahorran agua cerrando el grifo. Calcula la frecuencia relativa y explica qué se podría hacer con esa información a nivel de todo el colegio.", "items": ["Frecuencia relativa y aplicación"], "solucion": "24/30 = 0,8 (80%). Si la muestra es representativa, se podría estimar que un porcentaje similar de todas las familias del colegio ahorra agua, y usar ese dato para campañas de concienciación."}, {"enunciado": "Diseña una pregunta de encuesta sobre sostenibilidad (agua, luz, reciclaje) que podrías hacer a tu clase.", "items": ["Diseña la pregunta"], "solucion": "Respuesta libre, por ejemplo: «¿Apagas la luz al salir de una habitación vacía?» (sí/no)."}, {"enunciado": "De una muestra de 20 alumnos, 15 traen el desayuno en envase reutilizable. Calcula la frecuencia relativa y di si te parece suficiente para hablar de todo el colegio (400 alumnos).", "items": ["Frecuencia relativa y valoración"], "solucion": "15/20 = 0,75 (75%). Una muestra de 20 sobre 400 es pequeña (5%); para generalizar con más seguridad convendría una muestra mayor y más variada (de distintas clases y edades)."}], "problema_casa": {"enunciado": "Encuesta a tu familia sobre algún hábito de sostenibilidad y reflexiona si esa muestra se podría generalizar a todo el barrio.", "solucion": "Respuesta abierta: debe identificar claramente cuál es su muestra (su familia) y cuál sería la población (todo el barrio), y razonar si esa muestra es suficientemente representativa."}, "infografia_b64": "images/img_cbf9e277d6a9.webp", "fecha": "2027-01-21", "saberes": ["Identificación de un conjunto de datos como muestra de un conjunto más grande y reflexión sobre la población a la que es posible aplicar las conclusiones de investigaciones estadísticas sencillas relacionadas con diferentes contextos medioambientales y los Objetivos de Desarrollo Sostenible."], "pra": {"teoria": "Una muestra es una parte pequeña a la que preguntamos. La población es todo el grupo del que queremos saber algo.\n\nVamos a practicar diferenciando muestra y población en casos muy sencillos.", "ejercicios": [{"enunciado": "¿Qué es la muestra y qué es la población?", "items": ["preguntas a 5 compañeros de una clase de 25", "preguntas a 10 vecinos de un barrio de 500", "pruebas 3 caramelos de una bolsa de 30", "preguntas a 2 profesores de un cole con 20 profesores", "pruebas 1 galleta de una caja de 12"], "solucion": "a) muestra 5, población 25 · b) muestra 10, población 500 · c) muestra 3, población 30 · d) muestra 2, población 20 · e) muestra 1, población 12"}, {"enunciado": "¿Es una muestra representativa? Responde SÍ o NO.", "items": ["preguntar solo a tus 3 mejores amigos sobre el deporte de toda la clase", "preguntar a 15 de 25 alumnos elegidos al azar", "preguntar solo a los que juegan al fútbol sobre el deporte favorito de la clase", "preguntar a 20 de 25 alumnos al azar", "preguntar solo a 1 persona sobre el gusto de 100 personas"], "solucion": "a) NO · b) SÍ · c) NO · d) SÍ · e) NO"}, {"enunciado": "Verdadero o falso.", "items": ["La muestra es una parte de la población.", "La población es siempre más pequeña que la muestra.", "Una muestra representativa da información fiable.", "Preguntar a pocas personas mal elegidas puede dar un resultado equivocado.", "La muestra y la población pueden ser el mismo grupo si preguntamos a todos."], "solucion": "a) V · b) F · c) V · d) V · e) V"}, {"enunciado": "Identifica cuál es más grande: ¿la muestra o la población?", "items": ["5 alumnos de una clase de 25", "10 vecinos de un barrio de 300", "toda la clase preguntada (25 de 25)", "3 caramelos de una bolsa de 20", "1 examen de 30 exámenes"], "solucion": "a) la población · b) la población · c) son iguales · d) la población · e) la población"}, {"enunciado": "Piensa y responde.", "items": ["¿Por qué es mejor elegir la muestra al azar?", "¿Qué pasa si eliges una muestra solo con tus amigos?", "¿Por qué una muestra pequeña puede no ser fiable?", "¿Qué significa que una muestra sea representativa?", "¿Por qué a veces no se pregunta a toda la población?"], "solucion": "a) porque todos tienen las mismas posibilidades de ser elegidos · b) el resultado puede no representar a todo el grupo · c) porque puede no reflejar bien a todo el grupo · d) que se parece a la población en sus características · e) porque preguntar a todos puede llevar mucho tiempo o dinero"}]}}, {"n": 8, "name": "Interpretar datos reales", "calculo_diario": {"sumas": [["6 208 + 4 795", "11 003"], ["31 456 + 9 087", "40 543"]], "restas": [["8 200 − 3 654", "4 546"], ["45 302 − 27 819", "17 483"]], "mult": [["456 × 9", "4 104"], ["2 108 × 7", "14 756"]], "div": [["5 928 ÷ 6", "988"], ["8 415 ÷ 3", "2 805"]]}, "teoria": "Al leer una tabla o gráfico real, fíjate primero en el título, las unidades y qué representa cada columna.\n\nEl sentido crítico es clave: no todos los datos que vemos están bien representados, hay que comprobar si tienen sentido.\n\nPara comparar datos y sacar conclusiones, compara los valores más altos y más bajos y calcula diferencias. Cuidado con las conclusiones: una tabla no siempre dice todo, hay que pensar qué información falta.", "ejercicios": [{"enunciado": "Con la tabla de medallas olímpicas, ¿qué país obtuvo más medallas de oro?", "items": ["País con más medallas de oro"], "solucion": "País A, con 12 medallas de oro."}, {"enunciado": "¿Qué país tiene más medallas en total (oro+plata+bronce)? Calcúlalo para los 5 países.", "items": ["A", "B", "C", "D", "E"], "solucion": "a) 12+9+8 = 29<br>b) 10+11+7 = 28<br>c) 9+6+10 = 25<br>d) 7+8+9 = 24<br>e) 6+7+5 = 18 → el país A tiene el total más alto (29)"}, {"enunciado": "Responde verdadero (V) o falso (F):", "items": ["Al leer una tabla, primero hay que fijarse en el título y las unidades.", "Todos los datos que vemos están siempre bien representados.", "Comparar valores altos y bajos ayuda a sacar conclusiones.", "Una tabla siempre da toda la información necesaria sobre un tema.", "El sentido crítico ayuda a valorar si un dato tiene sentido."], "solucion": "a) V<br>b) F — no siempre están bien representados<br>c) V<br>d) F — puede faltar información relevante<br>e) V"}, {"enunciado": "Corrige el error: un compañero dice que el país A es \"el mejor\" solo porque tiene más medallas de oro, sin mirar el total. ¿Qué le falta considerar?", "items": ["¿Qué le falta considerar?"], "solucion": "Le falta considerar el total de medallas (oro+plata+bronce) de cada país, ya que otro país podría tener más medallas en conjunto aunque menos de oro."}, {"enunciado": "Calcula la diferencia entre el país con más medallas de oro y el que tiene menos.", "items": ["Diferencia"], "solucion": "12 (país A) − 6 (país E) = 6 medallas de oro de diferencia."}, {"enunciado": "Ordena los 5 países de mayor a menor según su número de medallas de plata.", "items": ["Orden por plata"], "solucion": "B (11) > A (9) > D (8) > E (7) > C (6)"}, {"enunciado": "Explica con tus palabras qué significa \"leer un gráfico con sentido crítico\".", "items": ["Explica"], "solucion": "Significa no aceptar un dato o gráfico sin pensarlo: comprobar si las cifras tienen sentido, si falta información importante, y no sacar conclusiones apresuradas a partir de un solo dato."}, {"enunciado": "Busca (o inventa) una noticia con un dato estadístico y explica si te parece bien explicado o si le falta información (como el tamaño de la muestra).", "items": ["Análisis crítico de la noticia"], "solucion": "Respuesta abierta: debe valorar si la noticia indica claramente la fuente, el tamaño de la muestra y las unidades, y si las conclusiones que extrae están justificadas por los datos mostrados."}], "problema_casa": {"enunciado": "Busca una tabla o gráfico en una noticia o en un envase, y explica qué representa, qué te llama la atención y si crees que está bien explicado.", "solucion": "Respuesta abierta: debe describir el título, las unidades, el dato más llamativo y valorar si falta alguna información (como el tamaño de la muestra o la fuente) para poder confiar plenamente en él."}, "infografia_b64": "images/img_09963f77cdd8.webp", "fecha": "2027-01-22", "saberes": ["Relación y comparación de dos conjuntos de datos a partir de su representación gráfica: formulación de conjeturas, análisis de la dispersión y obtención de conclusiones."], "pra": {"teoria": "Al leer una tabla o gráfico, primero miramos el título y las unidades, y después comparamos los datos más altos y más bajos para sacar conclusiones.\n\nVamos a practicar leyendo tablas muy sencillas de dos columnas.", "ejercicios": [{"enunciado": "Con esta tabla (Lunes 5, Martes 8, Miércoles 3), responde.", "items": ["¿qué día tiene más?", "¿qué día tiene menos?", "diferencia entre el mayor y el menor", "total de los tres días", "¿es martes mayor que lunes?"], "solucion": "a) martes · b) miércoles · c) 5 · d) 16 · e) sí"}, {"enunciado": "Ordena estos datos de mayor a menor.", "items": ["5, 8, 3", "10, 2, 6", "4, 9, 1", "7, 7, 3", "6, 6, 6"], "solucion": "a) 8, 5, 3 · b) 10, 6, 2 · c) 9, 4, 1 · d) 7, 7, 3 · e) 6, 6, 6"}, {"enunciado": "¿Qué dato es mayor?", "items": ["5 o 8", "10 o 2", "4 o 9", "7 o 3", "6 o 6"], "solucion": "a) 8 · b) 10 · c) 9 · d) 7 · e) iguales"}, {"enunciado": "Verdadero o falso.", "items": ["Al leer una tabla, primero miramos el título.", "Todos los datos de una tabla son siempre iguales.", "Comparar el mayor y el menor ayuda a sacar conclusiones.", "El sentido crítico ayuda a leer bien los datos.", "No hace falta mirar las unidades de una tabla."], "solucion": "a) V · b) F · c) V · d) V · e) F"}, {"enunciado": "Calcula la diferencia entre estos dos datos.", "items": ["8 y 3", "10 y 4", "6 y 6", "9 y 2", "7 y 5"], "solucion": "a) 5 · b) 6 · c) 0 · d) 7 · e) 2"}]}}, {"n": 9, "name": "Practica el examen", "tipo_examen": true, "intro": "En esta última sesión repasamos y ponemos a prueba todo lo aprendido en la unidad. Primero revisa el mapa mental y después completa la prueba escrita.", "partes": [{"titulo": "PARTE 1 · Tablas y gráficos", "puntos": 3, "contenido": "1) Se pregunta a 20 vecinos su medio de transporte: coche 9, autobús 6, bici 3, andando 2. Construye la tabla de frecuencias absolutas y relativas.\n2) ¿Qué gráfico usarías para representar las alturas (cm) de 30 plantas agrupadas en intervalos de 5 cm: barras, sectores o histograma? Razona.\n3) En un gráfico de sectores sobre destino de vacaciones de 40 alumnos, «playa» ocupa el 50%. ¿Cuántos alumnos eligieron la playa?"}, {"titulo": "PARTE 2 · Media, moda y rango", "puntos": 3, "contenido": "4) Calcula la media de estas notas: 6, 8, 7, 9, 5, 7.\n5) Calcula la moda de estos datos: 3, 5, 3, 2, 5, 3, 4.\n6) Calcula el rango de estas temperaturas: 18, 22, 19, 25, 20."}, {"titulo": "PARTE 3 · Probabilidad y muestra", "puntos": 4, "contenido": "7) En una bolsa hay 10 bolas: 4 rojas, 3 azules y 3 verdes. ¿Cuál es la probabilidad de sacar una bola azul?\n8) Un ayuntamiento pregunta a 200 personas de un total de 15.000 habitantes si usan el transporte público. ¿Cuál es la muestra y cuál la población?"}], "autoevaluacion": [{"texto": "Organizo datos en tablas de frecuencias absolutas y relativas.", "repaso": "Sesión 1"}, {"texto": "Elijo el diagrama de barras o de sectores más adecuado.", "repaso": "Sesión 2"}, {"texto": "Interpreto un histograma y sé cuándo usarlo.", "repaso": "Sesión 3"}, {"texto": "Calculo la media y la moda de un conjunto de datos.", "repaso": "Sesión 4"}, {"texto": "Calculo el rango y comparo dos conjuntos de datos.", "repaso": "Sesión 5"}, {"texto": "Calculo probabilidades sencillas aplicando la regla de Laplace.", "repaso": "Sesión 6"}, {"texto": "Distingo una muestra de una población en un estudio estadístico.", "repaso": "Sesión 7"}, {"texto": "Interpreto tablas y gráficos reales con sentido crítico.", "repaso": "Sesión 8"}], "solucionario": "1. Coche: 9/20=0,45 (45%) · Autobús: 6/20=0,30 (30%) · Bici: 3/20=0,15 (15%) · Andando: 2/20=0,10 (10%). Suman 1 (100%).\n2. Histograma: son datos cuantitativos continuos (la altura) agrupados en intervalos.\n3. 50% de 40 = 20 alumnos.\n4. (6+8+7+9+5+7)÷6 = 42÷6 = 7.\n5. El 3 se repite 3 veces (más que cualquier otro valor) → moda = 3.\n6. Máximo 25, mínimo 18 → rango = 25−18 = 7.\n7. P(azul) = 3/10 = 0,3 (30%).\n8. Muestra: las 200 personas encuestadas. Población: los 15.000 habitantes del municipio.", "saberes": ["Conjuntos de datos y gráficos estadísticos de la vida cotidiana: descripción, interpretación y análisis crítico.", "Cálculo de probabilidades en experimentos, comparaciones o investigaciones en los que sea aplicable la regla de Laplace."], "fecha": "2027-01-25"}], "criteria": [{"code": "9.1", "label": "Organizar, representar e interpretar datos estadísticos con la tabla y el gráfico más adecuados.", "evidence": "Sesiones 1, 2 y 3 y Parte 1 del examen."}, {"code": "9.2", "label": "Calcular e interpretar la media, la moda y el rango de un conjunto de datos.", "evidence": "Sesiones 4 y 5 y Parte 2 del examen."}, {"code": "9.3", "label": "Calcular probabilidades sencillas con la regla de Laplace y distinguir muestra de población.", "evidence": "Sesiones 6, 7 y 8 y Parte 3 del examen."}], "rubrica": null, "infografia_unidad_b64": "images/img_7a43bef51b51.webp"}, "sa1": {"tipo_sa": true, "title": "SA1 · Olimpiada Matemática", "subtitle": "Torneo de cálculo y resolución de problemas (5.º y 6.º)", "trimestre": "1.er trimestre", "presentacion": "La Olimpiada Matemática del Tercer Ciclo es una actividad conjunta de 5.º y 6.º de Primaria para el primer trimestre: un torneo real de cálculo y resolución de problemas, con una fase de grupos en el aula y una fase final en directo en el teatro del colegio.\n\nEl objetivo es repasar y aplicar, en formato de juego y competición sana, el cálculo y la resolución de problemas trabajados en las primeras semanas del curso.", "contenidos_incluye": ["Cálculo mental con números naturales, decimales y fracciones.", "Operaciones básicas: sumas, restas, multiplicaciones y divisiones.", "Potencias: cuadrados y cubos.", "Resolución de problemas de la vida cotidiana."], "contenidos_no_incluye": ["Divisibilidad (múltiplos, divisores, mcm, MCD): no aparece en los saberes de 5.º ni de 6.º — es contenido propio de 1.º ESO.", "Operaciones con números enteros (regla de los signos): en 6.º, «enteros» solo aparece como distinción conceptual entre tipos de número, sin operaciones — es también contenido de 1.º ESO."], "estructura": "\n      <p><b>Fase 1 — Fase de grupos (en el aula).</b> Cada clase de 5.º y de 6.º compite internamente. Se realizan las 4 pruebas a lo largo de una o varias sesiones. Se suman los puntos de las 4 pruebas para obtener la puntuación total de cada alumno o alumna. Los mejores clasificados de cada clase (número a decidir por el tutor o la tutora, por ejemplo 3 o 4 por clase) pasan a la fase final.</p>\n      <p style=\"margin-top:10px;\"><b>Fase 2 — Fase final (en el teatro).</b> Los clasificados de todas las clases de 5.º y de 6.º compiten en directo, con marcador visible para el público. Se organiza por rondas eliminatorias, separando las categorías de 5.º y de 6.º. Al finalizar, entrega de diplomas a los participantes.</p>\n    ", "actividades": [{"n": 1, "etiqueta": "PRUEBA", "titulo": "Cálculo mental", "fecha": "2026-09-21", "formato": "10 preguntas orales o en pantalla, 10 segundos cada una", "descripcion": "El alumnado responde 10 preguntas de cálculo mental, una tras otra, con solo 10 segundos para cada una. Se puede hacer de forma oral (el profesor lee la pregunta) o proyectando las preguntas en pantalla.", "puntuacion": "1 punto por acierto (máximo 10 puntos).", "banco_5": "1. 45 + 38 → 83\n2. 120 − 45 → 75\n3. 7 × 8 → 56\n4. 100 ÷ 4 → 25\n5. 6² → 36", "banco_6": "1. 340 + 275 → 615\n2. 500 − 186 → 314\n3. 12 × 9 → 108\n4. 144 ÷ 12 → 12\n5. 5³ → 125"}, {"n": 2, "etiqueta": "PRUEBA", "titulo": "Sumas y restas", "fecha": "2026-09-22", "formato": "5 operaciones escritas", "descripcion": "El alumnado resuelve por escrito, en su cuaderno o ficha, 5 operaciones de sumas y restas con números de varias cifras.", "puntuacion": "2 puntos por operación correcta (máximo 10 puntos).", "banco_5": "1. 4.567 + 3.289 → 7.856\n2. 8.901 − 4.567 → 4.334", "banco_6": "1. 45.678 + 23.891 → 69.569\n2. 100.000 − 45.678 → 54.322"}, {"n": 3, "etiqueta": "PRUEBA", "titulo": "Multiplicación y división", "fecha": "2026-09-23", "formato": "5 operaciones escritas", "descripcion": "El alumnado resuelve por escrito 5 operaciones de multiplicación y división.", "puntuacion": "2 puntos por operación correcta (máximo 10 puntos).", "banco_5": "1. 234 × 6 → 1.404\n2. 848 ÷ 8 → 106", "banco_6": "1. 1.234 × 24 → 29.616\n2. 4.500 ÷ 15 → 300"}, {"n": 4, "etiqueta": "PRUEBA", "titulo": "Problema", "fecha": "2026-09-24", "formato": "1 problema de aplicación", "descripcion": "El alumnado resuelve un problema de la vida cotidiana, mostrando el planteamiento, el cálculo y el resultado final.", "puntuacion": "Planteamiento 3 + cálculo 4 + resultado 3 (máximo 10 puntos). Puntuación total posible del torneo: 40 puntos por participante.", "banco_5": "«En un colegio andaluz hay 320 alumnos y alumnas. El 25% son de Educación Infantil. ¿Cuántos alumnos de Infantil hay?»\nSolución: 320 × 0,25 = 80 alumnos de Infantil.", "banco_6": "«Un autobús lleva 45 pasajeros. En la primera parada bajan 12 y suben 8. En la segunda parada bajan 15 y suben 5. ¿Cuántos pasajeros lleva ahora?»\nSolución: 45 − 12 + 8 = 41 tras la primera parada; 41 − 15 + 5 = 31 pasajeros tras la segunda."}], "diferenciacion": {"categorias": ["Números", ", "presentacion": "Actividad práctica, en gran parte en el patio, en la que el alumnado aprende a orientarse con los puntos cardinales, a leer e interpretar un plano con puntos de referencia, a calcular distancias reales a partir de una escala, y a dibujar su propio plano.\n\nEsta Situación de Aprendizaje recoge un contenido que no estaba siendo trabajado en ninguna unidad del curso: la orientación en planos y mapas. Por eso, y porque se presta mejor a actividades al aire libre, se ha situado en el 2.º trimestre como Situación de Aprendizaje, en vez de como unidad de cuaderno.", "contenidos_incluye": ["Los puntos cardinales y la orientación.", "Lectura de planos y mapas: leyenda, símbolos, puntos de referencia.", "Descripción de direcciones y trayectos.", "Escalas y cálculo de distancias reales."], "materiales": ["Una brújula por grupo (o una aplicación de brújula en el móvil/tablet).", "Un plano sencillo del colegio o de una zona del patio, con leyenda y escala.", "Cinta métrica o metro plegable.", "Cuerda o cordel para medir distancias largas.", "Fichas de ruta para la gymkhana (una por grupo)."], "actividades": [{"n": 1, "etiqueta": "ACTIVIDAD", "titulo": "Los puntos cardinales", "fecha": "2027-02-08", "descripcion": "En el patio, localizamos el norte con una brújula (o con la sombra de un palo vertical al mediodía, cuando la sombra es más corta y señala hacia el norte). Identificamos los 4 puntos cardinales y señalamos hacia dónde apunta cada uno."}, {"n": 2, "etiqueta": "ACTIVIDAD", "titulo": "Leer el plano del colegio", "fecha": "2027-02-09", "descripcion": "Repartimos un plano sencillo del colegio (o de una zona) con una leyenda de símbolos y una escala indicada. El alumnado identifica puntos de referencia (la entrada, el patio, la biblioteca...) y orienta el plano correctamente, con el norte hacia arriba."}, {"n": 3, "etiqueta": "ACTIVIDAD", "titulo": "La gymkhana de orientación", "fecha": "2027-02-10", "descripcion": "En grupos, siguen un recorrido con ins function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { units: {} };
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
let STATE = loadState();
if (!STATE.units) STATE.units = {};

function unitState() {
  const fechaTeorica = UNIT1.sessions[UNIT1.sessions.length - 1].fecha;
  if (!STATE.units[CURRENT_UNIT_ID]) STATE.units[CURRENT_UNIT_ID] = { sessions: {}, video: "", examen: "", libro: "", obsUnidad: "", criteria: {}, horarioDias: [0,1,2,3], horarioStart: UNIT1.sessions[0].fecha, horarioFestivos: [], fechaPrevista: fechaTeorica };
  const st = STATE.units[CURRENT_UNIT_ID];
  const fixedVideo = FIXED_UNIT_VIDEOS[CURRENT_UNIT_ID];
  if (fixedVideo && !st.video) st.video = fixedVideo;
  if (FIXED_STUDENT_BOOK_URL && !st.libro) st.libro = FIXED_STUDENT_BOOK_URL;
  if (!st.horarioFestivos) st.horarioFestivos = [];
  if (st.fechaPrevista === undefined || st.fechaPrevista === "") st.fechaPrevista = fechaTeorica;
  if (st.libro === undefined) st.libro = "";
  return st;
}

function getSessionState(n) {
  const st = unitState();
  if (!st.sessions[n]) st.sessions[n] = { fecha: null, realizada: false, ex: {}, saberes: {} };
  if (!st.sessions[n].ex) st.sessions[n].ex = {};
  if (!st.sessions[n].saberes) st.sessions[n].saberes = {};
  return st.sessions[n];
}
function getExState(n, i) {
  const s = getSessionState(n);
  if (!s.ex[i]) s.ex[i] = { colegio: false, casa: false, corregido: false };
  return s.ex[i];
}
function getSaberState(n, i) {
  const s = getSessionState(n);
  if (s.saberes[i] === undefined) s.saberes[i] = false;
  return s.saberes[i];
}
function updateSaber(n, i, val) {
  const s = getSessionState(n);
  s.saberes[i] = val;
  saveState();
}
function totalItems(s) { return s.tipo_examen ? 0 : s.ejercicios.length; }

function progressLabel(n) {
  const s = UNIT1.sessions.find(x => x.n === n);
  if (s.tipo_examen) return 'Examen de práctica';
  const total = totalItems(s);
  const st = getSessionState(n);
  if (st.realizada) return total + '/' + total + ' corregidos';
  let done = 0;
  for (let i = 1; i <= total; i++) { if (st.ex[i] && st.ex[i].corregido) done++; }
  return done + '/' + total + ' corregidos';
}

    if (ALL_UNITS[u.id]) return `<button class="nav-pill built" onclick="switchUnit('${u.id}')">${u.label}</button>`;
    return `<span class="nav-pill disabled">${u.label}</span>`;
  }).join('');
}

}

function fitTitleToOneLine(el) {
  let size = 26;
  el.style.fontSize = size + 'px';
  const lh = () => parseFloat(getComputedStyle(el).lineHeight) || size * 1.15;
  const topbarLeft = el.closest('.topbar-left');
  const schoolId = document.querySelector('.school-id');

  function rowWrapped() {
    if (el.getBoundingClientRect().height > lh() * 1.3) return true;
    if (topbarLeft && schoolId) {
      return Math.abs(topbarLeft.getBoundingClientRect().top - schoolId.getBoundingClientRect().top) > 5;
    }
    return false;
  }

  let guard = 0;
  while (rowWrapped() && size > 15 && guard < 30) {
    size -= 1;
    el.style.fontSize = size + 'px';
    guard++;
  }
}

function isSchoolDay(dateObj, stU) {
  const jsDay = dateObj.getDay();
  const iso = isoDate(dateObj);
  return jsDay >= 1 && jsDay <= 5 && stU.horarioDias.includes(jsDay - 1) && !stU.horarioFestivos.includes(iso);
}

function nextSchoolDay(fromIso, stU) {
  const [y, m, d] = fromIso.split('-').map(Number);
  let cur = new Date(y, m - 1, d);
  let guard = 0;
  do {
    cur.setDate(cur.getDate() + 1);
    guard++;
  } while (guard < 300 && (!isSchoolDay(cur, stU) || isoDate(cur) === stU.fechaPrevista));
  return isoDate(cur);
}

function cascadeFechasFrom(n) {
  const stU = unitState();
  if (!stU.horarioDias || stU.horarioDias.length === 0) return;
  const idx = UNIT1.sessions.findIndex(s => s.n === n);
  if (idx === -1) return;
  let prevIso = getSessionState(n).fecha;
  for (let i = idx + 1; i < UNIT1.sessions.length; i++) {
    const sig = UNIT1.sessions[i];
    if (sig.tipo_examen) break; // el examen mantiene su fecha prevista; no se arrastra con la cascada
    const nuevaIso = nextSchoolDay(prevIso, stU);
    getSessionState(sig.n).fecha = nuevaIso;
    prevIso = nuevaIso;
  }
}

function updateFecha(n, val) {
  getSessionState(n).fecha = val;
  cascadeFechasFrom(n);

function buildMonthGrid(y, m, stU, sessByIso, prevT, todayIso, reservedByIso) {
  // Genera un mes de calendario completo (L-D), con dias de meses vecinos en gris para completar la rejilla.
  const first = new Date(y, m, 1);
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const startOffset = (first.getDay() + 6) % 7; // lunes=0
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
  const cells = [];
  for (let i = 0; i < totalCells; i++) {
    const dayNum = i - startOffset + 1;
    const dateObj = new Date(y, m, dayNum); // JS normaliza automaticamente fuera de rango
    const iso = isoDate(dateObj);
    const inMonth = dayNum >= 1 && dayNum <= daysInMonth;
    const dayIdx = (dateObj.getDay() + 6) % 7; // 0=L ... 6=D
    const sess = sessByIso[iso];
    cells.push({
      iso, date: dateObj, inMonth, dayIdx,
      isWeekend: dayIdx >= 5,
      isSession: !!sess, sess,
      isFestivo: stU.horarioFestivos.includes(iso),
      isValidClassDay: dayIdx < 5 && stU.horarioDias.includes(dayIdx),
      isToday: iso === todayIso,
      isPrevista: prevT !== null && iso === stU.fechaPrevista,
      isPast: iso < todayIso,
      isReserved: !!(reservedByIso && reservedByIso[iso]),
      reservedLabel: reservedByIso ? reservedByIso[iso] : null,
    });
  }
  const monthNames = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return { year: y, month: m, label: monthNames[m] + ' ' + y, cells };
}

function buildWeekGrid(stU) {
  const sessDates = UNIT1.sessions.map(s => (getSessionState(s.n).fecha || s.fecha));
  const sessTimes = sessDates.map(f => new Date(f + 'T00:00:00').getTime());
  const regularTimes = UNIT1.sessions
    .filter(s => !s.tipo_examen)
    .map(s => new Date((getSessionState(s.n).fecha || s.fecha) + 'T00:00:00').getTime());
  const firstT = Math.min(...sessTimes);
  const lastT = regularTimes.length ? Math.max(...regularTimes) : Math.max(...sessTimes);
  const prevT = stU.fechaPrevista ? new Date(stU.fechaPrevista + 'T00:00:00').getTime() : null;
  const endT = Math.max(lastT, prevT !== null ? prevT : -Infinity, ...sessTimes);
  const todayIso = isoDate(new Date());

  const sessByIso = {};
  UNIT1.sessions.forEach((s, idx) => { sessByIso[sessDates[idx]] = s; });

  // Dias reservados de la unidad: huecos habiles entre la ultima sesion normal y el examen,
  // sin sesion asignada. Se etiquetan +1, +2, +3... acercandose al examen.
  const reservedByIso = {};
  if (prevT !== null && prevT > lastT) {
    let cur = new Date(lastT);
    cur.setDate(cur.getDate() + 1);
    const examD = new Date(prevT);
    let n = 0;
    while (cur < examD) {
      const jsDay = cur.getDay();
      const iso = isoDate(cur);
      const esDiaClase = jsDay >= 1 && jsDay <= 5 && stU.horarioDias.includes(jsDay - 1) && !stU.horarioFestivos.includes(iso);
      if (esDiaClase && !sessByIso[iso]) {
        n++;
        reservedByIso[iso] = '+' + n;
      }
      cur.setDate(cur.getDate() + 1);
    }
  }

  const startD = new Date(firstT), endD = new Date(endT);
  const months = [];
  let y = startD.getFullYear(), m = startD.getMonth();
  const endY = endD.getFullYear(), endM = endD.getMonth();
  let guard = 0;
  while ((y < endY || (y === endY && m <= endM)) && guard < 12) {
    months.push(buildMonthGrid(y, m, stU, sessByIso, prevT, todayIso, reservedByIso));
    m++; if (m > 11) { m = 0; y++; }
    guard++;
  }
  return { months, lastT, prevT };
}

function contarDiasHabiles(stU, fromExclusiveT, toInclusiveT) {
  // Cuenta días de clase (según horarioDias, sin festivos) entre las dos fechas.
  // Positivo = toInclusiveT es posterior (margen a favor, SIN contar el propio día del examen).
  // Negativo = toInclusiveT es anterior o igual (desfase, contando hasta el día actual inclusive).
  const sign = toInclusiveT >= fromExclusiveT ? 1 : -1;
  const [a, b] = sign === 1 ? [fromExclusiveT, toInclusiveT] : [toInclusiveT, fromExclusiveT];
  if (a === b) return 0;
  let n = 0;
  let cur = new Date(a);
  cur.setDate(cur.getDate() + 1);
  const end = new Date(b);
  while (cur <= end) {
    const esUltimoDia = cur.getTime() === end.getTime();
    if (!(sign === 1 && esUltimoDia)) {
      const jsDay = cur.getDay();
      const iso = isoDate(cur);
      if (jsDay >= 1 && jsDay <= 5 && stU.horarioDias.includes(jsDay - 1) && !stU.horarioFestivos.includes(iso)) n++;
    }
    cur.setDate(cur.getDate() + 1);
  }
  return n * sign;
}

function generarFechas() {
  const st = unitState();
  const startVal = document.getElementById('horarioStart').value;
  if (!startVal || st.horarioDias.length === 0) return;
  st.horarioStart = startVal;
  const [y, m, d] = startVal.split('-').map(Number);
  let cur = new Date(y, m - 1, d);
  const regularSessions = UNIT1.sessions.filter(s => !s.tipo_examen);
  const examSession = UNIT1.sessions.find(s => s.tipo_examen);
  const picked = [];
  let guard = 0;
  while (picked.length < regularSessions.length && guard < 250) {
    const jsDay = cur.getDay();
    const iso = cur.getFullYear() + '-' + String(cur.getMonth()+1).padStart(2,'0') + '-' + String(cur.getDate()).padStart(2,'0');
    if (jsDay >= 1 && jsDay <= 5 && st.horarioDias.includes(jsDay - 1) && !st.horarioFestivos.includes(iso)) {
      picked.push(iso);
    }
    cur.setDate(cur.getDate() + 1);
    guard++;
  }
  regularSessions.forEach((s, i) => { getSessionState(s.n).fecha = picked[i]; });
  if (examSession && st.fechaPrevista) {
    getSessionState(examSession.n).fecha = st.fechaPrevista;
  }
  saveState();
  renderUnit();
  if (CURRENT_MODAL_TYPE === 'calendario') document.getElementById('modalBody').innerHTML = buildCalendarModalHtml();
}


function renderSummary() {
  const totalSessions = UNIT1.sessions.length;
  let doneSessions = 0, totalEx = 0, doneEx = 0;
  UNIT1.sessions.forEach(s => {
    const st = getSessionState(s.n);
    if (st.realizada) doneSessions++;
    const t = totalItems(s);
    totalEx += t;
    if (st.realizada) {
      doneEx += t;
    } else {
      for (let i = 1; i <= t; i++) { if (st.ex[i] && st.ex[i].corregido) doneEx++; }
    }
  });
  const pct = totalSessions === 0 ? 0 : Math.round((doneSessions / totalSessions) * 100);
  const r = 24, c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;

  const stU = unitState();
  const { lastT, prevT } = buildWeekGrid(stU);
  const margen = prevT !== null ? contarDiasHabiles(stU, lastT, prevT) : null;
  let margenHtml = '';
  if (margen !== null) {
    if (margen > 0) margenHtml = `<span class="margen-tag ok">+${margen} día${margen===1?'':'s'} de margen</span>`;
    else if (margen === 0) margenHtml = `<span class="margen-tag exact">Justo a tiempo</span>`;
    else margenHtml = `<span class="margen-tag late">${Math.abs(margen)} día${Math.abs(margen)===1?'':'s'} de retraso</span>`;
  }

  document.getElementById('summaryPanel').innerHTML = `
    <div class="summary-top">
    <div class="summary-ring">
      <svg viewBox="0 0 56 56">
        <circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/>
        <circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--ok)" stroke-width="5"
          stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
      </svg>
      <div class="pct">${pct}%</div>
    </div>
    <div class="summary-text">
      <h4>Progreso de la unidad</h4>
      <div class="summary-stats">
        <span class="summary-stat"><b>${doneSessions}/${totalSessions}</b> sesiones realizadas</span>
        <span class="summary-stat"><b>${doneEx}/${totalEx}</b> ejercicios corregidos</span>
      </div>
    </div>
    <button class="cal-strip-btn" onclick="openModal('calendario')" title="Ver calendario de la unidad">
      ${ICONS.calendar}
      ${margenHtml || '<span class="cal-strip-label">Ver calendario</span>'}
    </button>
    </div>`;
}

function renderPendingBox() {
  const box = document.getElementById('pendingBox');
  const rows = [];

  UNIT1.sessions.forEach(s => {
    if (s.tipo_examen) return;
    const st = getSessionState(s.n);
    const pendientes = [];
    s.ejercicios.forEach((item, idx) => {
      const i = idx + 1;
      const ex = st.ex[i];
      if (ex && (ex.colegio || ex.casa) && !ex.corregido) pendientes.push(i);
    });
    if (pendientes.length) rows.push({ n: s.n, pendientes });
  });

  if (rows.length === 0) {
    box.innerHTML = `<h4>📌 Pendientes de corregir</h4><div class="pending-empty">Nada pendiente. Todo lo mandado ya está corregido.</div>`;
    return;
  }

  const listaHtml = rows.map(r => {
    const nums = r.pendientes;
    let actividadesTxt;
    if (nums.length === 1) {
      actividadesTxt = 'Actividad ' + nums[0];
    } else {
      const todas = nums.join(', ').replace(/, ([^,]*)$/, ' y $1');
      actividadesTxt = 'Actividades ' + todas;
    }
    return `<div class="pending-row"><b>Sesión ${r.n}</b> ${actividadesTxt}</div>`;
  }).join('');

  box.innerHTML = `<h4>📌 Pendientes de corregir</h4>${listaHtml}`;
}




function escapeDriveAttr(value) {
  return String(value || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function drivePreviewUrl(value) {
  const url = String(value || '').trim();
  const match = url.match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/);
  return match ? 'https://drive.google.com/file/d/' + match[1] + '/preview' : url;
}
function buildDriveViewer(value, type) {
  const original = String(value || '').trim();
  const preview = drivePreviewUrl(original);
  const isVideo = type === 'video';
  const label = isVideo ? 'Vídeo resumen integrado' : 'Libro del alumnado integrado';
  const hint = isVideo
    ? 'La reproducción se realiza dentro del cuaderno.'
    : 'Usa la rueda del ratón sobre el documento para recorrer las páginas.';
  return '<div class="drive-viewer-wrap">' +
    '<iframe class="drive-viewer-frame ' + (isVideo ? 'video' : 'pdf') + '" src="' + escapeDriveAttr(preview) + '" title="' + label + '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="eager"></iframe>' +
    '</div><div class="drive-viewer-tools"><span>' + hint + '</span>' +
    '<a class="drive-viewer-open" href="' + escapeDriveAttr(original) + '" target="_blank" rel="noopener">Abrir en Drive ↗</a></div>';
}
