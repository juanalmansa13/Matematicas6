<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escritorio de Matemáticas 6º</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F7F2E9; --paper:#FFFDFA; --ink:#262220; --ink-soft:#5B5450;
    --line:#E3DACB; --line-strong:#CBBEA6; --navy:#223A5E; --navy-soft:#E8EDF3;
    --dictado:#6E4A9E; --dictado-soft:#EDE6F5; --oral:#1D7A6B; --oral-soft:#E1F0EC;
    --escrita:#B8552E; --escrita-soft:#F5E4D8; --examen:#A3402F; --examen-soft:#F6E2DD; --ok:#1D7A6B;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; padding:32px 24px 60px; }
  .wrap { max-width:1000px; margin:0 auto; }

  .topbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;
    padding-bottom:20px; border-bottom:2px solid var(--ink); margin-bottom:20px; }
  .topbar-left { display:flex; align-items:center; gap:16px; }
  .topbar-left img { height:58px; width:auto; }
  .unit-heading h1 { font-family:'Fraunces',serif; font-weight:600; font-size:34px; margin:0; letter-spacing:-0.01em; line-height:1.05; }
  .unit-heading .meta { display:flex; align-items:center; gap:10px; margin-top:8px; }
  .trimestre-badge { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em;
    background:var(--navy); color:#fff; padding:4px 10px; border-radius:3px; }
  .unit-subtitle { font-size:14px; color:var(--ink-soft); }
  .school-id { text-align:right; font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
  .portada-link { font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:var(--navy);
    background:none; border:none; cursor:pointer; padding:0 0 4px; }
  .portada-link:hover { text-decoration:underline; }

  .nav-row { display:flex; gap:5px; flex-wrap:nowrap; margin-bottom:26px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin; }
  .nav-row::-webkit-scrollbar { height:5px; }
  .nav-row::-webkit-scrollbar-thumb { background:var(--line-strong); border-radius:10px; }
  .nav-pill { font-size:11px; padding:6px 10px; border-radius:16px; border:1px solid var(--line-strong); white-space:nowrap; flex-shrink:0;
    background:var(--paper); color:var(--ink-soft); cursor:default; font-weight:500; font-family:'Inter',sans-serif; }
  .nav-pill.active { background:var(--ink); color:#fff; border-color:var(--ink); cursor:pointer; }
  .nav-pill.disabled { opacity:0.45; }
  .nav-pill.built { color:var(--navy); border-color:var(--navy); cursor:pointer; background:#fff; }
  .nav-pill.built:hover { background:var(--navy-soft); }

  .layout { display:grid; grid-template-columns:1fr 270px; gap:20px; align-items:start; }
  @media (max-width:860px) { .layout { grid-template-columns:1fr; } }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:680px) { .grid3 { grid-template-columns:1fr; } }

  .session-card { background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:11px 12px;
    display:flex; flex-direction:column; gap:6px; position:relative; transition:box-shadow .15s,border-color .15s; }
  .session-card.done { border-color:var(--ok); box-shadow:0 0 0 1px var(--ok); }
  .card-top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card-top .sn { font-size:10.5px; color:var(--ink-soft); font-weight:600; letter-spacing:0.03em; text-transform:uppercase; }
  .realizada-chip { display:flex; align-items:center; gap:4px; font-size:10.5px; font-weight:600; color:var(--ink-soft);
    background:#fff; border:1px solid var(--line-strong); border-radius:20px; padding:2px 8px 2px 6px; cursor:pointer; white-space:nowrap; user-select:none; }
  .realizada-chip input { width:12px; height:12px; accent-color:var(--ok); cursor:pointer; }
  .realizada-chip.checked { background:var(--ok); border-color:var(--ok); color:#fff; }
  .session-card .sname { font-family:'Fraunces',serif; font-size:14.5px; font-weight:500; line-height:1.28; }
  .tipo-tag { align-self:flex-start; font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:4px; white-space:nowrap; }
  .tipo-tag.dictado { background:var(--dictado-soft); color:var(--dictado); }
  .tipo-tag.oral { background:var(--oral-soft); color:var(--oral); }
  .tipo-tag.escrita { background:var(--escrita-soft); color:var(--escrita); }
  .tipo-tag.examen { background:var(--examen-soft); color:var(--examen); }

  .fecha-row { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-soft); white-space:nowrap; }
  .fecha-row input[type=date] { font-family:'Inter',sans-serif; font-size:11px; border:1px solid var(--line-strong);
    border-radius:5px; padding:2px 3px; color:var(--ink); background:#fff; width:98px; flex:1; }
  .fecha-dl { width:24px; height:24px; flex-shrink:0; border:1px solid var(--line-strong); background:#fff; color:var(--ink-soft);
    border-radius:5px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .fecha-dl:hover { background:var(--navy-soft); border-color:var(--navy); color:var(--navy); }
  .fecha-dl svg { width:13px; height:13px; }

  .btn-row { display:flex; gap:5px; }
  .ibtn { width:30px; height:30px; flex-shrink:0; border:1px solid var(--line-strong); background:#fff; color:var(--ink);
    border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .12s,border-color .12s; }
  .ibtn:hover { background:var(--navy-soft); border-color:var(--navy); }
  .ibtn.primary { background:var(--navy); color:#fff; border-color:var(--navy); flex:1; gap:6px; font-size:11.5px; font-weight:600; font-family:'Inter',sans-serif; }
  .ibtn.primary:hover { background:#1a2e4a; }
  .ibtn svg { width:15px; height:15px; flex-shrink:0; }
  .prog-note { font-size:10px; color:var(--ink-soft); }

  .side-col { display:flex; flex-direction:column; gap:16px; }
  .criteria-box { background:var(--navy); color:#fff; border-radius:10px; padding:18px; }
  .criteria-box h3 { font-family:'Fraunces',serif; font-size:15px; font-weight:500; margin:0 0 4px; }
  .criteria-box .sub { font-size:12px; color:#C8D3E0; margin-bottom:14px; }
  .crit-item { padding:10px 0; border-top:1px solid rgba(255,255,255,0.15); }
  .crit-item:first-of-type { border-top:none; padding-top:0; }
  .crit-code { font-size:12.5px; font-weight:700; color:#F0C79A; }
  .crit-label { font-size:11px; font-weight:400; line-height:1.42; margin-top:3px; color:#EAEFF5; }
  .crit-evidence-wrap { display:flex; align-items:flex-start; gap:5px; margin-top:4px; }
  .crit-evidence-wrap span { font-size:12px; color:#C8D3E0; font-style:italic; padding-top:5px; }
  .crit-evidence-input { flex:1; min-width:0; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25);
    border-radius:5px; color:#fff; font-family:'Inter',sans-serif; font-size:11.5px; font-style:italic;
    padding:5px 7px; line-height:1.3; }
  .crit-evidence-input::placeholder { color:#8FA0B8; }
  .crit-evidence-input:focus { outline:none; border-color:#F0C79A; background:rgba(255,255,255,0.14); }

  .menu-box { background:var(--navy); border:1px solid var(--navy); border-radius:10px; overflow:hidden; }
  .menu-item { display:flex; align-items:center; gap:10px; width:100%; text-align:left; font-family:'Inter',sans-serif;
    font-size:13px; font-weight:500; color:#fff; background:none; border:none; border-top:1px solid rgba(255,255,255,0.15);
    padding:13px 16px; cursor:pointer; }
  .menu-item:first-child { border-top:none; }
  .menu-item:hover { background:rgba(255,255,255,0.08); }
  .menu-item svg:first-child { width:16px; height:16px; color:#C8D3E0; flex-shrink:0; }
  .menu-item .chev { width:14px; height:14px; margin-left:auto; color:rgba(255,255,255,0.45); flex-shrink:0; }

  .pending-box { background:var(--escrita-soft); border:1px dashed var(--escrita); border-radius:10px; padding:14px 16px; }
  .pending-box h4 { margin:0 0 8px; font-family:'Fraunces',serif; font-weight:600; font-size:13.5px; color:var(--escrita); }
  .pending-row { font-size:12.5px; line-height:1.6; color:var(--ink); padding:3px 0; }
  .pending-row b { color:var(--escrita); font-weight:700; margin-right:4px; }
  .pending-empty { font-size:12px; color:var(--ink-soft); font-style:italic; }

  .link-row { display:flex; gap:6px; }
  .link-row input[type=text] { flex:1; min-width:0; font-family:'Inter',sans-serif; font-size:13px;
    border:1px solid var(--line-strong); border-radius:6px; padding:8px 10px; background:#fff; color:var(--ink); }
  .open-link { font-size:12.5px; font-weight:600; color:var(--navy); text-decoration:none;
    border:1px solid var(--line-strong); border-radius:6px; padding:8px 12px; white-space:nowrap; }
  .open-link.disabled { color:var(--ink-soft); pointer-events:none; opacity:.5; }
  .save-hint { font-size:10.5px; color:var(--ink-soft); margin-top:6px; }
  .edit-link-btn { position:absolute; top:10px; right:14px; z-index:2; font-size:11.5px; font-weight:600; color:var(--navy);
    background:#fff; border:1px solid var(--line-strong); border-radius:6px; padding:5px 10px; cursor:pointer; }
  .edit-link-btn:hover { background:var(--navy-soft, #eef1f7); }
  .drive-viewer-body { position:relative; }

  .summary-panel { background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:16px 20px; margin-bottom:22px; display:flex; flex-direction:column; gap:14px; }
  .summary-top { display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
  .summary-ring { position:relative; width:56px; height:56px; flex-shrink:0; }
  .summary-ring svg { transform:rotate(-90deg); width:56px; height:56px; }
  .summary-ring .pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:600; color:var(--navy); font-family:'Fraunces',serif; }
  .summary-text { flex:1; min-width:180px; }
  .summary-text h4 { font-family:'Fraunces',serif; font-size:14.5px; font-weight:500; margin:0 0 4px; }
  .summary-stats { display:flex; gap:20px; flex-wrap:wrap; }
  .summary-stat { font-size:12.5px; color:var(--ink-soft); }
  .summary-stat b { color:var(--ink); font-weight:600; }

  .cal-strip-btn { flex-shrink:0; height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px; background:var(--navy-soft); border:none; cursor:pointer; padding:6px 16px; border-radius:10px; color:var(--navy); }
  .cal-strip-btn:hover { background:#dde5ee; }
  .cal-strip-btn svg { width:20px; height:20px; }
  .cal-strip-label { font-size:11px; font-weight:600; color:var(--navy); white-space:nowrap; }
  .cal-modal-top { display:flex; justify-content:flex-end; margin-bottom:2px; }

  .week-grid-wrap { padding-top:12px; border-top:1px solid var(--line); }
  .mcal-row { display:flex; gap:20px; flex-wrap:wrap; }
  .mcal { flex:1; min-width:250px; max-width:320px; }
  .mcal-head { font-family:'Fraunces',serif; font-size:13px; font-weight:600; color:var(--ink); text-transform:capitalize;
    margin-bottom:6px; text-align:center; }
  .mcal-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:3px; }
  .mcal-dow { text-align:center; font-size:9.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; padding-bottom:2px; }
  .wgrid-cell { position:relative; aspect-ratio:1; border-radius:5px; border:1px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:500; color:var(--ink-soft); cursor:default; }
  .wgrid-cell.outmonth { opacity:0.22; pointer-events:none; }
  .wgrid-cell.weekend { background:#EFEAE0; color:var(--ink-soft); opacity:0.7; }
  .wgrid-cell.notclass { border-style:dashed; opacity:0.45; }
  .wgrid-cell.past:not(.sess):not(.festivo) { background:#EFE9DC; }
  .wgrid-cell.sess.pending { background:#fff; border:1.5px solid var(--navy); color:var(--navy); font-weight:700; }
  .wgrid-cell.sess.done { background:var(--ok); border-color:var(--ok); color:#fff; font-weight:700; }
  .wgrid-cell.reserved { background:var(--navy-soft); border:1.5px dashed var(--navy); color:var(--navy); }
  .wgrid-cell.reserved .wgrid-num { width:auto; min-width:16px; padding:0 3px; border-radius:7px; font-size:8px; }
  .wgrid-cell.festivo { background:var(--escrita-soft); border-color:var(--escrita); color:var(--escrita); }
  .wgrid-cell.today { box-shadow:0 0 0 2px var(--ink); z-index:1; }
  .wgrid-cell.prevista { box-shadow:0 0 0 2px #B8552E; z-index:1; }
  .wgrid-cell.today.prevista { box-shadow:0 0 0 2px var(--ink), 0 0 0 4px #B8552E; }
  .wgrid-num { position:absolute; bottom:-4px; right:-4px; background:var(--navy); color:#fff; border-radius:50%;
    width:14px; height:14px; font-size:8.5px; display:flex; align-items:center; justify-content:center; font-weight:700; border:1.5px solid var(--paper); }
  .wgrid-cell.sess.done .wgrid-num { background:#155c4a; }
  .wgrid-star { position:absolute; top:-7px; left:50%; transform:translateX(-50%); font-size:13px; color:#B8552E; line-height:1; }
  .wgrid-legend { display:flex; flex-wrap:wrap; gap:10px 14px; margin:10px 0 6px; font-size:10.5px; color:var(--ink-soft); }
  .wgrid-legend .lg-dot { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:4px; vertical-align:middle;
    border:1.5px solid var(--navy); background:#fff; }
  .lg-dot.sess.done { background:var(--ok); border-color:var(--ok); }
  .lg-dot.festivo { background:var(--escrita-soft); border-color:var(--escrita); }
  .lg-dot.today { border-color:var(--ink); box-shadow:0 0 0 1px var(--ink); }

  .margen-tag { font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px; }
  .margen-tag.ok { background:var(--oral-soft); color:var(--oral); }
  .margen-tag.exact { background:var(--navy-soft); color:var(--navy); }
  .margen-tag.late { background:var(--escrita-soft); color:var(--escrita); }

  .festivo-row { position:relative; }
  .fcal { position:absolute; top:36px; left:0; z-index:10; background:#fff; border:1px solid var(--line-strong);
    border-radius:10px; padding:12px; box-shadow:0 8px 24px rgba(0,0,0,0.15); width:260px; }
  .fcal-head { display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:600; margin-bottom:8px; }
  .fcal-head button { border:none; background:none; font-size:16px; cursor:pointer; color:var(--navy); padding:2px 8px; }
  .fcal-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:3px; }
  .fcal-dow { text-align:center; font-size:9.5px; font-weight:600; color:var(--ink-soft); }
  .fcal-cell { aspect-ratio:1; border:none; background:var(--paper); border-radius:5px; font-size:11px; cursor:pointer;
    color:var(--ink); font-family:'Inter',sans-serif; }
  .fcal-cell.empty { background:none; cursor:default; }
  .fcal-cell.weekend { color:var(--ink-soft); opacity:0.5; }
  .fcal-cell.on { background:var(--escrita); color:#fff; font-weight:700; }
  .fcal-cell:hover:not(.empty):not(.on) { background:var(--navy-soft); }
  .fcal-foot { font-size:10px; color:var(--ink-soft); margin-top:8px; line-height:1.4; }

  .horario-toggle { font-size:11px; font-weight:600; color:var(--navy); background:none; border:none; cursor:pointer;
    padding:0; text-decoration:underline; text-underline-offset:2px; font-family:'Inter',sans-serif; }
  .horario-panel { display:none; flex-direction:column; gap:12px; padding-top:12px; border-top:1px solid var(--line); }
  .horario-panel.open { display:flex; }
  .horario-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-top:10px; border-top:1px dashed var(--line); }
  .horario-row:first-child { padding-top:0; border-top:none; }
  .horario-label { font-size:12px; font-weight:600; color:var(--ink); font-family:'Fraunces',serif; white-space:nowrap; }
  .horario-spacer { flex:1; min-width:8px; }
  .horario-days { display:flex; gap:4px; }
  .day-chip { width:30px; height:30px; border-radius:6px; border:1px solid var(--line-strong); background:#fff;
    font-size:11.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; font-family:'Inter',sans-serif; }
  .day-chip.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  .horario-panel label { font-size:11.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .horario-panel input[type=date] { font-family:'Inter',sans-serif; font-size:12px; border:1px solid var(--line-strong);
    border-radius:5px; padding:4px 6px; }
  .gen-btn { font-family:'Inter',sans-serif; font-size:12px; font-weight:600; background:var(--navy); color:#fff;
    border:none; border-radius:6px; padding:7px 12px; cursor:pointer; white-space:nowrap; }
  .gen-btn:hover { background:#1a2e4a; }
  .festivo-list { display:flex; gap:6px; flex-wrap:wrap; }
  .festivo-chip { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:500; color:var(--escrita);
    background:var(--escrita-soft); border-radius:20px; padding:3px 6px 3px 10px; }
  .festivo-chip button { border:none; background:none; color:var(--escrita); font-size:14px; line-height:1; cursor:pointer; padding:0 2px; }
  .festivo-empty { font-size:11.5px; color:var(--ink-soft); font-style:italic; }
  .horario-hint { font-size:11px; color:var(--ink-soft); font-style:italic; flex-basis:100%; }

  .overlay { display:none; position:fixed; inset:0; background:rgba(38,34,32,0.55);
    align-items:center; justify-content:center; padding:24px; z-index:50; }
  .overlay.open { display:flex; }
  .modal { background:var(--paper); border-radius:12px; max-width:640px; width:100%; max-height:82vh;
    display:flex; flex-direction:column; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,0.25); transition:max-width .15s; }
  .modal.wide { max-width:820px; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); }
  .modal-head h3 { font-family:'Fraunces',serif; font-size:17px; font-weight:500; margin:0; }
  .modal-head .modal-sub { font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .close-x { width:30px; height:30px; border-radius:50%; border:1px solid var(--line-strong); background:#fff;
    cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-left:12px; }
  .close-x:hover { background:var(--navy-soft); }
  .modal-body { padding:8px 20px 20px; overflow-y:auto; font-size:14px; line-height:1.6; }
  .modal-body.text { padding:20px; white-space:pre-line; font-size:14.5px; line-height:1.75; }
  .modal-body.img { padding:16px; display:flex; }
  .modal-body.img img { width:100%; height:auto; border-radius:8px; display:block; }
  .modal-body .obs-textarea { width:100%; min-height:140px; resize:vertical; font-family:'Inter',sans-serif; font-size:13px;
    border:1px solid var(--line-strong); border-radius:7px; padding:10px 11px; color:var(--ink); background:#fff; line-height:1.55; }

  .ex-row { padding:14px 0; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  .ex-row:first-child { border-top:none; }
  .ex-num { font-size:12px; font-weight:600; color:var(--navy); }
  .ex-enun { font-size:13.5px; line-height:1.55; color:var(--ink); }
  .ex-sol { font-style:italic; color:var(--ink-soft); font-size:13.5px; line-height:1.55; }
  .ex-sol b { font-style:normal; font-weight:600; color:var(--ink-soft); }
  .ex-checks { display:flex; gap:16px; margin-top:2px; }
  .ex-checks label { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); cursor:pointer; }
  .ex-checks input { width:15px; height:15px; accent-color:var(--ok); cursor:pointer; }
  .ex-checks label.corregido-label.checked { color:var(--ok); font-weight:600; }

  .producto-box { margin-top:14px; padding:14px 16px; background:var(--navy-soft); border-left:3px solid var(--navy); border-radius:6px; }
  .producto-box b { font-size:12px; color:var(--navy); text-transform:uppercase; letter-spacing:0.03em; }
  .producto-box p { margin:6px 0 0; font-size:13.5px; line-height:1.55; color:var(--ink); }

  .rubrica-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .rubrica-table th, .rubrica-table td { border:1px solid var(--line-strong); padding:8px 10px; text-align:left; vertical-align:top; line-height:1.4; }
  .rubrica-table th { background:var(--navy); color:#fff; font-weight:600; font-size:11.5px; }
  .rubrica-table td:first-child { font-weight:600; background:var(--navy-soft); white-space:nowrap; }
  .rubrica-note { font-size:12px; color:var(--ink-soft); margin-top:12px; font-style:italic; }

  footer { max-width:1100px; margin:40px auto 0; padding-top:16px; border-top:1px solid var(--line-strong);
    font-size:11.5px; color:var(--ink-soft); display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; }

  #dashboardWrap { display:block; }

  
  .calculo-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-bottom:18px; }
  @media (max-width:600px) { .calculo-grid { grid-template-columns:1fr; } }
  .calculo-cat { border:1px solid var(--line-strong); border-radius:10px; padding:12px; }
  .calculo-cat h4 { margin:0 0 8px; font-family:'Fraunces',serif; font-size:14px; color:var(--navy); }
  .calc-item { border-bottom:1px solid var(--line); padding:8px 0; }
  .calc-item:last-child { border-bottom:none; }
  .calc-expr { font-family:'IBM Plex Mono',monospace; font-size:14px; margin-bottom:6px; }
  .calc-sol-btn { background:var(--navy-soft); color:var(--navy); border:none; border-radius:6px; padding:4px 10px; font-size:11.5px; font-weight:600; cursor:pointer; }
  .calc-sol { display:none; margin-top:6px; font-weight:700; color:var(--ok); font-family:'IBM Plex Mono',monospace; }
  .calc-sol.show { display:block; }
  .teoria-box { background:var(--navy-soft); border-radius:10px; padding:14px 16px; margin-bottom:16px; font-size:13.5px; line-height:1.6; }
  .teoria-box h4 { margin:0 0 8px; font-family:'Fraunces',serif; color:var(--navy); font-size:14.5px; }
  .ex-items { margin:6px 0; font-size:13px; color:var(--ink-soft); }
  .ex-sub { padding:2px 0; }
  .saberes-box { background:#F1EADB; border-left:3px solid var(--navy); border-radius:8px; padding:12px 16px; margin-top:16px; }
  .saberes-box h4 { margin:0 0 8px; font-family:'Fraunces',serif; color:var(--navy); font-size:13.5px; }
  .saber-item { display:flex; align-items:flex-start; gap:8px; font-size:12.5px; line-height:1.5; padding:5px 0; cursor:pointer; }
  .saber-item input { margin-top:3px; flex-shrink:0; }

  /* Visores integrados de Drive para vídeo y PDF */
  .modal.drive-modal { max-width:1080px; max-height:90vh; }
  .modal.drive-modal .modal-body { padding:0; overflow:hidden; display:flex; flex-direction:column; }
  .drive-viewer-wrap { background:#171717; min-height:62vh; display:flex; align-items:stretch; }
  .drive-viewer-frame { width:100%; height:66vh; min-height:470px; border:0; background:#fff; display:block; }
  .drive-viewer-frame.video { background:#111; }
  .drive-viewer-tools { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 16px; background:#fff; border-top:1px solid var(--line); font-size:12px; color:var(--ink-soft); }
  .drive-viewer-tools span { line-height:1.35; }
  .drive-viewer-open { flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line-strong); border-radius:7px; padding:7px 10px; text-decoration:none; color:var(--navy); background:#fff; font-weight:600; font-size:12px; }
  .drive-viewer-open:hover { background:var(--navy-soft); }
  .drive-empty { padding:18px 0 4px; color:var(--ink-soft); font-size:13px; }
  @media (max-width:720px) {
    .overlay { padding:10px; }
    .modal.drive-modal { max-height:94vh; }
    .drive-viewer-wrap { min-height:58vh; }
    .drive-viewer-frame { height:62vh; min-height:390px; }
    .drive-viewer-tools { align-items:flex-start; flex-direction:column; gap:8px; }
  }

 4.088", "2.288"], ["8.000 − 2.745", "5.255"]], "mult": [["30 × 9", "270"], ["17 × 22", "374"]], "div": [["444 : 6", "74"], ["960 : 8", "120"]]}, "saberes": ["Aplicar operaciones con decimales y comprobar resultados.", "Valor posicional, cálculo y estimación"], "infografia_b64": "images/img_e12b286b9c37.webp", "pra": {"teoria": "Los decimales aparecen en la vida diaria: el dinero, los pesos, las alturas. Para resolverlos, seguimos siempre los mismos pasos: leer bien, elegir la operación y calcular con cuidado.\n\nVamos a practicar solo con problemas de dinero muy sencillos.", "ejercicios": [{"enunciado": "Resuelve.", "items": ["Compro pan de 1,2 € y agua de 0,8 €: ¿cuánto pago?", "Tenía 10,0 € y gasto 3,5 €: ¿cuánto me queda?", "3 caramelos a 0,3 € cada uno: ¿cuánto pago?", "Reparto 6,0 € entre 3 amigos: ¿cuánto le toca a cada uno?", "Peso 32,5 kg y mi mochila 3,2 kg: ¿cuánto pesamos juntos?"], "solucion": "a) 2,0 € · b) 6,5 € · c) 0,9 € · d) 2,0 € · e) 35,7 kg"}, {"enunciado": "Escribe la operación (suma, resta, multiplicación o división) para cada problema.", "items": ["juntar dos precios", "quitar un gasto de lo que tenías", "el precio de varias unidades iguales", "repartir una cantidad entre varias personas", "el peso total de dos cosas juntas"], "solucion": "a) suma · b) resta · c) multiplicación · d) división · e) suma"}, {"enunciado": "Calcula el cambio (lo que te devuelven).", "items": ["pagas con 5 € algo de 3,5 €", "pagas con 10 € algo de 7,2 €", "pagas con 2 € algo de 1,3 €", "pagas con 20 € algo de 15,5 €", "pagas con 1 € algo de 0,6 €"], "solucion": "a) 1,5 € · b) 2,8 € · c) 0,7 € · d) 4,5 € · e) 0,4 €"}, {"enunciado": "Verdadero o falso.", "items": ["Los precios se suelen escribir con decimales.", "Para calcular el cambio, se resta.", "3 × 0,3 significa multiplicar.", "Repartir entre varios es sumar.", "Los kilos y los metros pueden ser decimales."], "solucion": "a) V · b) V · c) V · d) F · e) V"}, {"enunciado": "Resuelve este problema paso a paso.", "
